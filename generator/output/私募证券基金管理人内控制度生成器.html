<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>私募证券基金管理人内控制度生成器</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --line:#e3e6ea; --line2:#eef0f3;
  --tx:#1b1f24; --tx2:#5b6570; --tx3:#8b949e;
  --pri:#1f4e8c; --pri-bg:#eaf1fa;
  --law:#6b3fa0; --law-bg:#f3edfb;
  --err:#b3261e; --err-bg:#fdecea;
  --warn:#8a5a00; --warn-bg:#fff5e0;
  --ok:#1a7f4b;  --ok-bg:#e8f6ee;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 24px;
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:18px;font-weight:650;letter-spacing:.2px}
header .sub{color:var(--tx2);font-size:12.5px}
header .badge{margin-left:auto;font-size:11.5px;color:var(--tx3);
  border:1px solid var(--line);border-radius:20px;padding:3px 11px;background:#fafbfc}

.wrap{display:grid;grid-template-columns:390px 1fr;gap:18px;padding:18px 24px 60px;align-items:start}
@media(max-width:1080px){.wrap{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card>h2{margin:0;padding:12px 16px;font-size:13.5px;font-weight:650;
  border-bottom:1px solid var(--line2);background:#fbfcfd;letter-spacing:.2px}
.card>h2 .hint{font-weight:400;color:var(--tx3);font-size:11.5px;margin-left:6px}
.body{padding:14px 16px}
.pane{position:sticky;top:14px}

label.f{display:block;margin-bottom:11px}
label.f .t{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
input[type=text],input[type=number],select{width:100%;padding:7px 9px;border:1px solid var(--line);
  border-radius:6px;font-size:13px;background:#fff;color:var(--tx);font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-bg)}

table.dept{width:100%;border-collapse:collapse;font-size:13px}
table.dept th{text-align:left;font-weight:500;color:var(--tx3);font-size:11.5px;
  padding:0 6px 6px 0;border-bottom:1px solid var(--line2)}
table.dept td{padding:3px 6px 3px 0}
table.dept td input{padding:5px 8px;font-size:12.5px}
.del{border:none;background:none;color:var(--tx3);cursor:pointer;font-size:16px;padding:0 4px;line-height:1}
.del:hover{color:var(--err)}

.btn{border:1px solid var(--line);background:#fff;color:var(--tx);padding:7px 13px;
  border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--pri);color:var(--pri);background:var(--pri-bg)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:#173d6e;color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

details.adv{margin-top:14px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd}
details.adv>summary{padding:9px 12px;cursor:pointer;font-size:12.5px;color:var(--tx2);user-select:none}
details.adv>summary:hover{color:var(--pri)}
.optgrid{padding:4px 12px 12px;display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
.optgrid label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx2);cursor:pointer}
.optgrid label.single{grid-column:1/-1}
.optgrid input[type=checkbox]{width:14px;height:14px;accent-color:var(--pri)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);background:#fbfcfd;padding:0 8px}
.tabs button{border:none;background:none;padding:11px 15px;font-size:13px;color:var(--tx2);
  cursor:pointer;border-bottom:2px solid transparent;font-family:inherit}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.tabs button:hover{color:var(--pri)}
.tabpane{display:none;padding:16px}
.tabpane.on{display:block}

.empty{color:var(--tx3);text-align:center;padding:44px 20px;font-size:13px}
.empty b{display:block;color:var(--tx2);font-size:14px;margin-bottom:6px;font-weight:600}

.diag{border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:10px;background:#fff}
.diag.sev{border-left:3px solid var(--err)}
.diag.warn{border-left:3px solid var(--warn)}
.diag.ok{border-left:3px solid var(--ok)}
.diag .h{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.diag .h b{font-size:13.5px}
.tag{font-size:11px;padding:1.5px 7px;border-radius:4px;font-weight:600}
.tag.sev{background:var(--err-bg);color:var(--err)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.diag .a{color:var(--tx2);font-size:12.5px}
.diag .a b{color:var(--tx);font-weight:600}

table.std{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
table.std th{text-align:left;padding:7px 8px;background:#f7f8fa;color:var(--tx2);
  font-weight:600;font-size:11.5px;border-bottom:1px solid var(--line)}
table.std td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.std tr.miss td{background:var(--err-bg)}
table.std tr.low td{background:var(--warn-bg)}
table.std tr.hit td{background:var(--ok-bg)}
td.n{text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}

.ref{display:inline-block;font-size:11px;color:var(--law);background:var(--law-bg);
  border-radius:4px;padding:1px 6px;margin:2px 4px 0 0;text-decoration:none;cursor:pointer}
.ref.miss{background:var(--err-bg);color:var(--err)}

.modbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;
  padding:9px 11px;background:#f7f8fa;border-radius:8px;border:1px solid var(--line2)}
.modbar .cnt{font-size:12px;color:var(--tx2)}
.modlist{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.moditem{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid var(--line2);font-size:12.5px}
.moditem:last-child{border-bottom:none}
.moditem:hover{background:#fafbfc}
.moditem input{width:14px;height:14px;accent-color:var(--pri)}
.moditem .nm{flex:1}
.moditem .kd{font-size:10.5px;padding:1px 6px;border-radius:3px;background:#eef0f3;color:var(--tx2)}
.moditem .kd.t{background:var(--pri-bg);color:var(--pri)}
.moditem .kd.o{background:var(--warn-bg);color:var(--warn)}

pre.out{white-space:pre-wrap;word-break:break-word;background:#fbfcfd;border:1px solid var(--line);
  border-radius:8px;padding:14px;font-family:var(--mono);font-size:12px;line-height:1.75;
  max-height:640px;overflow:auto;color:#22272e}
pre.out .k{color:var(--law);font-weight:600}
pre.out .q{color:var(--tx2)}

.searchbar{display:flex;gap:8px;margin-bottom:12px}
.lawitem{border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:9px;background:#fff}
.lawitem .t{font-size:12.5px;font-weight:600;color:var(--law);margin-bottom:5px}
.lawitem .x{font-size:12.5px;color:var(--tx);line-height:1.7}
mark{background:#fff2a8;padding:0 1px;border-radius:2px}
.footnote{margin-top:16px;padding:12px 14px;background:#f7f8fa;border:1px solid var(--line2);
  border-radius:8px;font-size:11.5px;color:var(--tx3);line-height:1.7}
.footnote b{color:var(--tx2)}
</style>
</head>
<body>

<header>
  <h1>私募证券基金管理人内控制度生成器</h1>
  <span class="sub">输入组织架构 · 自动生成带法规原文的制度 · 输出架构合规诊断</span>
  <span class="badge" id="badge">加载中</span>
</header>

<div class="wrap">

  <!-- ========== 左：输入 ========== -->
  <div class="pane">
    <div class="card">
      <h2>组织架构输入 <span class="hint">仅填公司名与部门人数即可</span></h2>
      <div class="body">
        <label class="f"><span class="t">公司名称</span>
          <input type="text" id="company" placeholder="上海XX私募证券投资基金管理有限公司"></label>

        <label class="f"><span class="t">最高权力机构</span>
          <input type="text" id="gov" value="股东会"></label>

        <label class="f"><span class="t">总经理 / 主要负责人</span>
          <input type="text" id="gm" placeholder="（留空则用『总经理』）"></label>

        <label class="f"><span class="t">合规风控负责人 <span style="color:var(--err)">*</span></span>
          <input type="text" id="cco" placeholder="负责合规风控的高级管理人员姓名"></label>

        <div style="margin:14px 0 8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span class="t" style="font-size:12px;color:var(--tx2)">部门与人头</span>
            <button class="btn sm" id="fillStd">按标准架构填充</button>
          </div>
          <table class="dept">
            <thead><tr><th style="width:62%">部门 / 职能</th><th style="width:24%">人数</th><th></th></tr></thead>
            <tbody id="deptBody"></tbody>
          </table>
          <div class="row">
            <button class="btn sm" id="addDept">+ 增加部门</button>
            <span style="font-size:11.5px;color:var(--tx3);align-self:center" id="sumStaff"></span>
          </div>
        </div>

        <label class="f" style="margin-top:12px"><span class="t">高级管理人员人数</span>
          <input type="number" id="execN" min="0" value="2"></label>

        <details class="adv">
          <summary>业务安排（决定制度模块，可选）</summary>
          <div class="optgrid">
            <label><input type="checkbox" id="o_custody" checked>基金托管</label>
            <label><input type="checkbox" id="o_entrust">委托募集</label>
            <label><input type="checkbox" id="o_it" checked>信息技术自建</label>
            <label><input type="checkbox" id="o_acct" checked>会计核算自建</label>
            <label><input type="checkbox" id="o_out">其他业务外包</label>
            <label><input type="checkbox" id="o_otc">场外衍生品交易</label>
            <label><input type="checkbox" id="o_bond">债券投资</label>
            <label><input type="checkbox" id="o_prog">程序化交易</label>
            <label><input type="checkbox" id="o_prop">自有资金投资</label>
            <label><input type="checkbox" id="o_group">同一实控人多家管理人</label>
          </div>
        </details>

        <div class="row" style="margin-top:14px">
          <button class="btn pri" id="run">生成诊断与制度</button>
          <button class="btn" id="reset">重置</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== 右：结果 ========== -->
  <div class="card">
    <div class="tabs">
      <button class="on" data-tab="diag">组织架构诊断</button>
      <button data-tab="gen">制度生成</button>
      <button data-tab="law">法规原文库</button>
    </div>

    <div class="tabpane on" id="tab-diag">
      <div class="empty" id="diagEmpty"><b>尚未生成</b>填写左侧信息后点击「生成诊断与制度」</div>
      <div id="diagOut"></div>
    </div>

    <div class="tabpane" id="tab-gen">
      <div class="empty" id="genEmpty"><b>尚未生成</b>填写左侧信息后点击「生成诊断与制度」</div>
      <div id="genWrap" style="display:none">
        <div class="modbar">
          <button class="btn sm" id="selAll">全选</button>
          <button class="btn sm" id="selNone">全不选</button>
          <span class="cnt" id="modCnt"></span>
          <button class="btn sm pri" id="doGen" style="margin-left:auto">生成所选制度</button>
        </div>
        <div class="modlist" id="modList"></div>
        <div style="margin-top:14px;display:none" id="outBar">
          <div class="row" style="margin-bottom:8px">
            <button class="btn sm" id="copyMd">复制全文</button>
            <button class="btn sm" id="dlMd">下载 .md</button>
            <span style="font-size:11.5px;color:var(--tx3);align-self:center" id="outStat"></span>
          </div>
          <pre class="out" id="out"></pre>
        </div>
      </div>
    </div>

    <div class="tabpane" id="tab-law">
      <div class="searchbar">
        <input type="text" id="lawQ" placeholder="搜索条文关键词或条号，如：合格投资者 / 25% / 第十二条">
      </div>
      <div id="lawOut"></div>
    </div>
  </div>
</div>

<script id="platform-data" type="application/json">{"meta": {"built": "2026-09-28", "law_meta": {"内控指引": {"name": "《私募投资基金管理人内部控制指引》", "org": "中国证券投资基金业协会", "doc": "—", "date": "2016-02-01", "level": "自律规则"}, "运作指引": {"name": "《私募证券投资基金运作指引》", "org": "中国证券投资基金业协会", "doc": "—", "date": "2024-08-01", "level": "自律规则"}, "适当性办法": {"name": "《证券期货投资者适当性管理办法》", "org": "中国证券监督管理委员会", "doc": "证监会令第130号（2022年8月12日第二次修正）", "date": "2017-07-01", "level": "部门规章"}, "私募条例": {"name": "《私募投资基金监督管理条例》", "org": "国务院", "doc": "国务院令第762号", "date": "2023-09-01", "level": "行政法规"}, "登记备案办法": {"name": "《私募投资基金登记备案办法》", "org": "中国证券投资基金业协会", "doc": "—", "date": "2023-02-24", "level": "自律规则"}, "登记指引1号": {"name": "《私募基金管理人登记指引第1号——基本经营要求》", "org": "中国证券投资基金业协会", "doc": "—", "date": "2023-02-24", "level": "自律规则"}}, "missing_refs": []}, "laws": {"内控指引": {"1": "为了引导私募基金管理人加强内部控制，促进合法合规、诚信经营，提高风险防范能力，推动私募基金行业规范发展，根据《证券投资基金法》、《私募投资基金监督管理暂行办法》、《私募投资基金管理人登记和基金备案办法（试行）》，制定本指引。", "2": "私募基金管理人内部控制是指私募基金管理人为防范和化解风险，保证各项业务的合法合规运作，实现经营目标，在充分考虑内外部环境的基础上，对经营过程中的风险进行识别、评价和管理的制度安排、组织体系和控制措施。", "3": "私募基金管理人应当按照本指引的要求，结合自身的具体情况，建立健全内部控制机制，明确内部控制职责，完善内部控制措施，强化内部控制保障，持续开展内部控制评价和监督。私募基金管理人最高权力机构对建立内部控制制度和维持其有效性承担最终责任，经营层对内部控制制度的有效执行承担责任。", "4": "私募基金管理人内部控制总体目标是：（一）保证遵守私募基金相关法律法规和自律规则。（二）防范经营风险，确保经营业务的稳健运行。（三）保障私募基金财产的安全、完整。（四）确保私募基金、私募基金管理人财务和其他信息真实、准确、完整、及时。", "5": "私募基金管理人内部控制应当遵循以下原则：（一）全面性原则。内部控制应当覆盖包括各项业务、各个部门和各级人员，并涵盖资金募集、投资研究、投资运作、运营保障和信息披露等主要环节。（二）相互制约原则。组织结构应当权责分明、相互制约。（三）执行有效原则。通过科学的内控手段和方法，建立合理的内控程序，维护内控制度的有效执行。（四）独立性原则。各部门和岗位职责应当保持相对独立，基金财产、管理人固有财产、其他财产的运作应当分离。（五）成本效益原则。以合理的成本控制达到最佳的内部控制效果，内部控制与私募基金管理人的管理规模和员工人数等方面相匹配，契合自身实际情况。（六）适时性原则。私募基金管理人应当定期评价内部控制的有效性，并随着有关法律法规的调整和经营战略、方针、理念等内外部环境的变化同步适时修改或完善。", "6": "私募基金管理人建立与实施有效的内部控制，应当包括下列要素：（一）内部环境：包括经营理念和内控文化、治理结构、组织结构、人力资源政策和员工道德素质等，内部环境是实施内部控制的基础。（二）风险评估：及时识别、系统分析经营活动中与内部控制目标相关的风险，合理确定风险应对策略。（三）控制活动：根据风险评估结果，采用相应的控制措施，将风险控制在可承受范围之内。（四）信息与沟通：及时、准确地收集、传递与内部控制相关的信息，确保信息在内部、企业与外部之间进行有效沟通。（五）内部监督：对内部控制建设与实施情况进行周期性监督检查，评价内部控制的有效性，发现内部控制缺陷或因业务变化导致内控需求有变化的，应当及时加以改进、更新。", "7": "私募基金管理人应当牢固树立合法合规经营的理念和风险控制优先的意识，培养从业人员的合规与风险意识，营造合规经营的制度文化环境，保证管理人及其从业人员诚实信用、勤勉尽责、恪尽职守。", "8": "私募基金管理人应当遵循专业化运营原则，主营业务清晰，不得兼营与私募基金管理无关或存在利益冲突的其他业务。", "9": "私募基金管理人应当健全治理结构，防范不正当关联交易、利益输送和内部人控制风险，保护投资者利益和自身合法权益。", "10": "私募基金管理人组织结构应当体现职责明确、相互制约的原则，建立必要的防火墙制度与业务隔离制度，各部门有合理及明确的授权分工，操作相互独立。", "11": "私募基金管理人应当建立有效的人力资源管理制度，健全激励约束机制，确保工作人员具备与岗位要求相适应的职业操守和专业胜任能力。私募基金管理人应具备至少2名高级管理人员。", "12": "私募基金管理人应当设置负责合规风控的高级管理人员。负责合规风控的高级管理人员，应当独立地履行对内部控制监督、检查、评价、报告和建议的职能，对因失职渎职导致内部控制失效造成重大损失的，应承担相关责任。", "13": "私募基金管理人应当建立科学的风险评估体系，对内外部风险进行识别、评估和分析，及时防范和化解风险。", "14": "私募基金管理人应当建立科学严谨的业务操作流程，利用部门分设、岗位分设、外包、托管等方式实现业务流程的控制。", "15": "授权控制应当贯穿于私募基金管理人资金募集、投资研究、投资运作、运营保障和信息披露等主要环节的始终。私募基金管理人应当建立健全授权标准和程序，确保授权制度的贯彻执行。", "16": "私募基金管理人自行募集私募基金的，应设置有效机制，切实保障募集结算资金安全；私募基金管理人应当建立合格投资者适当性制度。", "17": "私募基金管理人委托募集的，应当委托获得中国证监会基金销售业务资格且成为中国证券投资基金业协会（以下简称\"中国基金业协会\"）会员的机构募集私募基金，并制定募集机构遴选制度，切实保障募集结算资金安全；确保私募基金向合格投资者募集以及不变相进行公募。", "18": "私募基金管理人应当建立完善的财产分离制度，私募基金财产与私募基金管理人固有财产之间、不同私募基金财产之间、私募基金财产和其他财产之间要实行独立运作，分别核算。", "19": "私募基金管理人应建立健全相关机制，防范管理的各私募基金之间的利益输送和利益冲突，公平对待管理的各私募基金，保护投资者利益。", "20": "私募基金管理人应当建立健全投资业务控制，保证投资决策严格按照法律法规规定，符合基金合同所规定的投资目标、投资范围、投资策略、投资组合和投资限制等要求。", "21": "除基金合同另有约定外，私募基金应当由基金托管人托管，私募基金管理人应建立健全私募基金托管人遴选制度，切实保障资金安全。基金合同约定私募基金不进行托管的，私募基金管理人应建立保障私募基金财产安全的制度措施和纠纷解决机制。", "22": "私募基金管理人开展业务外包应制定相应的风险管理框架及制度。私募基金管理人根据审慎经营原则制定其业务外包实施规划，确定与其经营水平相适宜的外包活动范围。", "23": "私募基金管理人应建立健全外包业务控制，并至少每年开展一次全面的外包业务风险评估。在开展业务外包的各个阶段，关注外包机构是否存在与外包服务相冲突的业务，以及外包机构是否采取有效的隔离措施。", "24": "私募基金管理人自行承担信息技术和会计核算等职能的，应建立相应的信息系统和会计系统，保证信息技术和会计核算等的顺利运行。", "25": "私募基金管理人应当建立健全信息披露控制，维护信息沟通渠道的畅通，保证向投资者、监管机构及中国基金业协会所披露信息的真实性、准确性、完整性和及时性，不存在虚假记载、误导性陈述或重大遗漏。", "26": "私募基金管理人应当保存私募基金内部控制活动等方面的信息及相关资料，确保信息的完整、连续、准确和可追溯，保存期限自私募基金清算终止之日起不得少于10年。", "27": "私募基金管理人应对内部控制制度的执行情况进行定期和不定期的检查、监督及评价，排查内部控制制度是否存在缺陷及实施中是否存在问题，并及时予以改进，确保内部控制制度的有效执行。", "28": "中国基金业协会对私募基金管理人内部控制的建立及执行情况进行监督。", "29": "私募基金管理人应当按照本指引要求制定相关内部控制制度，并在中国基金业协会私募基金登记备案系统填报及上传相关内部控制制度。", "30": "中国基金业协会按照相关自律规则，对私募基金管理人的人员、内部控制、业务活动及信息披露等合规情况进行业务检查，业务检查可通过现场或非现场方式进行，私募基金管理人及相关人员应予以配合。", "31": "私募基金管理人未按本指引建立健全内部控制，或内部控制存在重大缺陷，导致违反相关法律法规及自律规则的，中国基金业协会可以视情节轻重对私募基金管理人及主要负责人采取书面警示、行业内通报批评、公开谴责等措施。", "32": "本指引由中国基金业协会负责解释。", "33": "本指引自2016年2月1日起施行。"}, "私募条例": {"3": "国家鼓励私募基金行业规范健康发展，发挥服务实体经济、促进科技创新等功能作用。从事私募基金业务活动，应当遵循自愿、公平、诚信原则，保护投资者合法权益，不得违反法律、行政法规和国家政策，不得违背公序良俗，不得损害国家利益、社会公共利益和他人合法权益。私募基金管理人管理、运用私募基金财产，私募基金托管人托管私募基金财产，私募基金服务机构从事私募基金服务业务，应当遵守法律、行政法规规定，恪尽职守，履行诚实守信、谨慎勤勉的义务。私募基金从业人员应当遵守法律、行政法规规定，恪守职业道德和行为规范，按照规定接受合规和专业能力培训。", "4": "私募基金财产独立于私募基金管理人、私募基金托管人的固有财产。私募基金财产的债务由私募基金财产本身承担，但法律另有规定的除外。投资者按照基金合同、公司章程、合伙协议（以下统称基金合同）约定分配收益和承担风险。", "6": "国务院证券监督管理机构根据私募基金管理人业务类型、管理资产规模、持续合规情况、风险控制情况和服务投资者能力等，对私募基金管理人实施差异化监督管理，并对创业投资等股权投资、证券投资等不同类型的私募基金实施分类监督管理。", "1": "为了规范私募投资基金（以下简称私募基金）业务活动，保护投资者以及相关当事人的合法权益，促进私募基金行业规范健康发展，根据《中华人民共和国证券投资基金法》（以下简称《证券投资基金法》）、《中华人民共和国信托法》、《中华人民共和国公司法》、《中华人民共和国合伙企业法》等法律，制定本条例。", "2": "在中华人民共和国境内，以非公开方式募集资金，设立投资基金或者以进行投资活动为目的依法设立公司、合伙企业，由私募基金管理人或者普通合伙人管理，为投资者的利益进行投资活动，适用本条例。", "5": "私募基金业务活动的监督管理，应当贯彻党和国家路线方针政策、决策部署。国务院证券监督管理机构依照法律和本条例规定对私募基金业务活动实施监督管理，其派出机构依照授权履行职责。国家对运用一定比例政府资金发起设立或者参股的私募基金的监督管理另有规定的，从其规定。", "7": "私募基金管理人由依法设立的公司或者合伙企业担任。以合伙企业形式设立的私募基金，资产由普通合伙人管理的，普通合伙人适用本条例关于私募基金管理人的规定。私募基金管理人的股东、合伙人以及股东、合伙人的控股股东、实际控制人，控股或者实际控制其他私募基金管理人的，应当符合国务院证券监督管理机构的规定。", "8": "有下列情形之一的，不得担任私募基金管理人，不得成为私募基金管理人的控股股东、实际控制人或者普通合伙人：（一）本条例第九条规定的情形；（二）因本条例第十四条第一款第三项所列情形被注销登记，自被注销登记之日起未逾3年的私募基金管理人，或者为该私募基金管理人的控股股东、实际控制人、普通合伙人；（三）从事的业务与私募基金管理存在利益冲突；（四）有严重不良信用记录尚未修复。", "9": "有下列情形之一的，不得担任私募基金管理人的董事、监事、高级管理人员、执行事务合伙人或者委派代表：（一）因犯有贪污贿赂、渎职、侵犯财产罪或者破坏社会主义市场经济秩序罪，被判处刑罚；（二）最近3年因重大违法违规行为被金融管理部门处以行政处罚；（三）对所任职的公司、企业因经营不善破产清算或者因违法被吊销营业执照负有个人责任的董事、监事、厂长、高级管理人员、执行事务合伙人或者委派代表，自该公司、企业破产清算终结或者被吊销营业执照之日起未逾5年；（四）所负债务数额较大，到期未清偿或者被纳入失信被执行人名单；（五）因违法行为被开除的基金管理人、基金托管人、证券期货交易场所、证券公司、证券登记结算机构、期货公司以及其他机构的从业人员和国家机关工作人员；（六）因违法行为被吊销执业证书或者被取消资格的律师、注册会计师和资产评估机构、验证机构的从业人员、投资咨询从业人员，自被吊销执业证书或者被取消资格之日起未逾5年；（七）担任因本条例第十四条第一款第三项所列情形被注销登记的私募基金管理人的法定代表人、执行事务合伙人或者委派代表，或者负有责任的高级管理人员，自该私募基金管理人被注销登记之日起未逾3年。", "10": "私募基金管理人应当依法向国务院证券监督管理机构委托的机构（以下称登记备案机构）报送下列材料，履行登记手续：（一）统一社会信用代码；（二）公司章程或者合伙协议；（三）股东、实际控制人、董事、监事、高级管理人员，普通合伙人、执行事务合伙人或者委派代表的基本信息，股东、实际控制人、合伙人相关受益所有人信息；（四）保证报送材料真实、准确、完整和遵守监督管理规定的信用承诺书；（五）国务院证券监督管理机构规定的其他材料。私募基金管理人的控股股东、实际控制人、普通合伙人、执行事务合伙人或者委派代表等重大事项发生变更的，应当按照规定向登记备案机构履行变更登记手续。登记备案机构应当公示已办理登记的私募基金管理人相关信息。未经登记，任何单位或者个人不得使用\"基金\"或者\"基金管理\"字样或者近似名称进行投资活动，但法律、行政法规和国家另有规定的除外。", "11": "私募基金管理人应当履行下列职责：（一）依法募集资金，办理私募基金备案；（二）对所管理的不同私募基金财产分别管理、分别记账，进行投资；（三）按照基金合同约定管理私募基金并进行投资，建立有效的风险控制制度；（四）按照基金合同约定确定私募基金收益分配方案，向投资者分配收益；（五）按照基金合同约定向投资者提供与私募基金管理业务活动相关的信息；（六）保存私募基金财产管理业务活动的记录、账册、报表和其他有关资料；（七）国务院证券监督管理机构规定和基金合同约定的其他职责。以非公开方式募集资金设立投资基金的，私募基金管理人还应当以自己的名义，为私募基金财产利益行使诉讼权利或者实施其他法律行为。", "12": "私募基金管理人的股东、实际控制人、合伙人不得有下列行为：（一）虚假出资、抽逃出资、委托他人或者接受他人委托出资；（二）未经股东会或者董事会决议等法定程序擅自干预私募基金管理人的业务活动；（三）要求私募基金管理人利用私募基金财产为自己或者他人牟取利益，损害投资者利益；（四）法律、行政法规和国务院证券监督管理机构规定禁止的其他行为。", "13": "私募基金管理人应当持续符合下列要求：（一）财务状况良好，具有与业务类型和管理资产规模相适应的运营资金；（二）法定代表人、执行事务合伙人或者委派代表、负责投资管理的高级管理人员按照国务院证券监督管理机构规定持有一定比例的私募基金管理人的股权或者财产份额，但国家另有规定的除外；（三）国务院证券监督管理机构规定的其他要求。", "14": "私募基金管理人有下列情形之一的，登记备案机构应当及时注销私募基金管理人登记并予以公示：（一）自行申请注销登记；（二）依法解散、被依法撤销或者被依法宣告破产；（三）因非法集资、非法经营等重大违法行为被追究法律责任；（四）登记之日起12个月内未备案首只私募基金；（五）所管理的私募基金全部清算后，自清算完毕之日起12个月内未备案新的私募基金；（六）国务院证券监督管理机构规定的其他情形。登记备案机构注销私募基金管理人登记前，应当通知私募基金管理人清算私募基金财产或者依法将私募基金管理职责转移给其他经登记的私募基金管理人。", "15": "除基金合同另有约定外，私募基金财产应当由私募基金托管人托管。私募基金财产不进行托管的，应当明确保障私募基金财产安全的制度措施和纠纷解决机制。", "16": "私募基金财产进行托管的，私募基金托管人应当依法履行职责。私募基金托管人应当依法建立托管业务和其他业务的隔离机制，保证私募基金财产的独立和安全。", "17": "私募基金管理人应当自行募集资金，不得委托他人募集资金，但国务院证券监督管理机构另有规定的除外。", "18": "私募基金应当向合格投资者募集或者转让，单只私募基金的投资者累计不得超过法律规定的人数。私募基金管理人不得采取为单一融资项目设立多只私募基金等方式，突破法律规定的人数限制；不得采取将私募基金份额或者收益权进行拆分转让等方式，降低合格投资者标准。前款所称合格投资者，是指达到规定的资产规模或者收入水平，并且具备相应的风险识别能力和风险承担能力，其认购金额不低于规定限额的单位和个人。合格投资者的具体标准由国务院证券监督管理机构规定。", "19": "私募基金管理人应当向投资者充分揭示投资风险，根据投资者的风险识别能力和风险承担能力匹配不同风险等级的私募基金产品。", "20": "私募基金不得向合格投资者以外的单位和个人募集或者转让；不得向为他人代持的投资者募集或者转让；不得通过报刊、电台、电视台、互联网等大众传播媒介，电话、短信、即时通讯工具、电子邮件、传单，或者讲座、报告会、分析会等方式向不特定对象宣传推介；不得以虚假、片面、夸大等方式宣传推介；不得以私募基金托管人名义宣传推介；不得向投资者承诺投资本金不受损失或者承诺最低收益。", "21": "私募基金管理人运用私募基金财产进行投资的，在以私募基金管理人名义开立账户、列入所投资企业股东名册或者持有其他私募基金财产时，应当注明私募基金名称。", "22": "私募基金管理人应当自私募基金募集完毕之日起20个工作日内，向登记备案机构报送下列材料，办理备案：（一）基金合同；（二）托管协议或者保障私募基金财产安全的制度措施；（三）私募基金财产证明文件；（四）投资者的基本信息、认购金额、持有基金份额的数量及其受益所有人相关信息；（五）国务院证券监督管理机构规定的其他材料。私募基金应当具有保障基本投资能力和抗风险能力的实缴募集资金规模。登记备案机构根据私募基金的募集资金规模等情况实施分类公示，对募集的资金总额或者投资者人数达到规定标准的，应当向国务院证券监督管理机构报告。", "23": "国务院证券监督管理机构应当建立健全私募基金监测机制，对私募基金及其投资者份额持有情况等进行集中监测，具体办法由国务院证券监督管理机构规定。", "24": "私募基金财产的投资包括买卖股份有限公司股份、有限责任公司股权、债券、基金份额、其他证券及其衍生品种以及符合国务院证券监督管理机构规定的其他投资标的。私募基金财产不得用于经营或者变相经营资金拆借、贷款等业务。私募基金管理人不得以要求地方人民政府承诺回购本金等方式变相增加政府隐性债务。", "25": "私募基金的投资层级应当遵守国务院金融管理部门的规定。但符合国务院证券监督管理机构规定条件，将主要基金财产投资于其他私募基金的私募基金不计入投资层级。创业投资基金、本条例第五条第二款规定私募基金的投资层级，由国务院有关部门规定。", "26": "私募基金管理人应当遵循专业化管理原则，聘用具有相应从业经历的高级管理人员负责投资管理、风险控制、合规等工作。私募基金管理人应当遵循投资者利益优先原则，建立从业人员投资申报、登记、审查、处置等管理制度，防范利益输送和利益冲突。", "27": "私募基金管理人不得将投资管理职责委托他人行使。私募基金管理人委托其他机构为私募基金提供证券投资建议服务的，接受委托的机构应当为《证券投资基金法》规定的基金投资顾问机构。", "28": "私募基金管理人应当建立健全关联交易管理制度，不得以私募基金财产与关联方进行不正当交易或者利益输送，不得通过多层嵌套或者其他方式进行隐瞒。私募基金管理人运用私募基金财产与自己、投资者、所管理的其他私募基金、其实际控制人控制的其他私募基金管理人管理的私募基金，或者与其有重大利害关系的其他主体进行交易的，应当履行基金合同约定的决策程序，并及时向投资者和私募基金托管人提供相关信息。", "29": "私募基金管理人应当按照规定聘请会计师事务所对私募基金财产进行审计，向投资者提供审计结果，并报送登记备案机构。", "30": "私募基金管理人、私募基金托管人及其从业人员不得有下列行为：（一）将其固有财产或者他人财产混同于私募基金财产；（二）利用私募基金财产或者职务便利，为投资者以外的人牟取利益；（三）侵占、挪用私募基金财产；（四）泄露因职务便利获取的未公开信息，利用该信息从事或者明示、暗示他人从事相关的证券、期货交易活动；（五）法律、行政法规和国务院证券监督管理机构规定禁止的其他行为。", "31": "私募基金管理人在资金募集、投资运作过程中，应当按照国务院证券监督管理机构的规定和基金合同约定，向投资者提供信息。私募基金财产进行托管的，私募基金管理人应当按照国务院证券监督管理机构的规定和托管协议约定，及时向私募基金托管人提供投资者基本信息、投资标的权属变更证明材料等信息。", "32": "私募基金管理人、私募基金托管人及其从业人员提供、报送的信息应当真实、准确、完整，不得有下列行为：（一）虚假记载、误导性陈述或者重大遗漏；（二）对投资业绩进行预测；（三）向投资者承诺投资本金不受损失或者承诺最低收益；（四）法律、行政法规和国务院证券监督管理机构规定禁止的其他行为。", "33": "私募基金管理人、私募基金托管人、私募基金服务机构应当按照国务院证券监督管理机构的规定，向登记备案机构报送私募基金投资运作等信息。登记备案机构应当根据不同私募基金类型，对报送信息的内容、频次等作出规定，并汇总分析私募基金行业情况，向国务院证券监督管理机构报送私募基金行业相关信息。登记备案机构应当加强风险预警，发现可能存在重大风险的，及时采取措施并向国务院证券监督管理机构报告。登记备案机构应当对本条第一款规定的信息保密，除法律、行政法规另有规定外，不得对外提供。", "34": "因私募基金管理人无法正常履行职责或者出现重大风险等情形，导致私募基金无法正常运作、终止的，由基金合同约定或者有关规定确定的其他专业机构，行使更换私募基金管理人、修改或者提前终止基金合同、组织私募基金清算等职权。", "35": "本条例所称创业投资基金，是指符合下列条件的私募基金：（一）投资范围限于未上市企业，但所投资企业上市后基金所持股份的未转让部分及其配售部分除外；（二）基金名称包含\"创业投资基金\"字样，或者在公司、合伙企业经营范围中包含\"从事创业投资活动\"字样；（三）基金合同体现创业投资策略；（四）不使用杠杆融资，但国家另有规定的除外；（五）基金最低存续期限符合国家有关规定；（六）国家规定的其他条件。", "36": "国家对创业投资基金给予政策支持，鼓励和引导其投资成长性、创新性创业企业，鼓励长期资金投资于创业投资基金。国务院发展改革部门负责组织拟定促进创业投资基金发展的政策措施。国务院证券监督管理机构和国务院发展改革部门建立健全信息和支持政策共享机制，加强创业投资基金监督管理政策和发展政策的协同配合。登记备案机构应当及时向国务院证券监督管理机构和国务院发展改革部门报送与创业投资基金相关的信息。享受国家政策支持的创业投资基金，其投资应当符合国家有关规定。", "37": "国务院证券监督管理机构对创业投资基金实施区别于其他私募基金的差异化监督管理：（一）优化创业投资基金营商环境，简化登记备案手续；（二）对合法募资、合规投资、诚信经营的创业投资基金在资金募集、投资运作、风险监测、现场检查等方面实施差异化监督管理，减少检查频次；（三）对主要从事长期投资、价值投资、重大科技成果转化的创业投资基金在投资退出等方面提供便利。", "38": "登记备案机构在登记备案、事项变更等方面对创业投资基金实施区别于其他私募基金的差异化自律管理。", "39": "国务院证券监督管理机构对私募基金业务活动实施监督管理，依法履行下列职责：（一）制定有关私募基金业务活动监督管理的规章、规则；（二）对私募基金管理人、私募基金托管人以及其他机构从事私募基金业务活动进行监督管理，对违法行为进行查处；（三）对登记备案和自律管理活动进行指导、检查和监督；（四）法律、行政法规规定的其他职责。", "40": "国务院证券监督管理机构依法履行职责，有权采取下列措施：（一）对私募基金管理人、私募基金托管人、私募基金服务机构进行现场检查，并要求其报送有关业务资料；（二）进入涉嫌违法行为发生场所调查取证；（三）询问当事人和与被调查事件有关的单位和个人，要求其对与被调查事件有关的事项作出说明；（四）查阅、复制与被调查事件有关的财产权登记、通讯记录等资料；（五）查阅、复制当事人和与被调查事件有关的单位和个人的证券交易记录、登记过户记录、财务会计资料以及其他有关文件和资料；对可能被转移、隐匿或者毁损的文件和资料，可以予以封存；（六）依法查询当事人和与被调查事件有关的账户信息；（七）法律、行政法规规定的其他措施。为防范私募基金风险，维护市场秩序，国务院证券监督管理机构可以采取责令改正、监管谈话、出具警示函等措施。", "41": "国务院证券监督管理机构依法进行监督检查或者调查时，监督检查或者调查人员不得少于2人，并应当出示执法证件和监督检查、调查通知书或者其他执法文书。对监督检查或者调查中知悉的商业秘密、个人隐私，依法负有保密义务。被检查、调查的单位和个人应当配合国务院证券监督管理机构依法进行的监督检查或者调查，如实提供有关文件和资料，不得拒绝、阻碍和隐瞒。", "42": "国务院证券监督管理机构发现私募基金管理人违法违规，或者其内部治理结构和风险控制管理不符合规定的，应当责令限期改正；逾期未改正，或者行为严重危及该私募基金管理人的稳健运行、损害投资者合法权益的，国务院证券监督管理机构可以区别情形，对其采取下列措施：（一）责令暂停部分或者全部业务；（二）责令更换董事、监事、高级管理人员、执行事务合伙人或者委派代表，或者限制其权利；（三）责令负有责任的股东转让股权、负有责任的合伙人转让财产份额，限制负有责任的股东或者合伙人行使权利；（四）责令私募基金管理人聘请或者指定第三方机构对私募基金财产进行审计，相关费用由私募基金管理人承担。私募基金管理人违法经营或者出现重大风险，严重危害市场秩序、损害投资者利益的，国务院证券监督管理机构除采取前款规定的措施外，还可以对该私募基金管理人采取指定其他机构接管、通知登记备案机构注销登记等措施。", "43": "国务院证券监督管理机构应当将私募基金管理人、私募基金托管人、私募基金服务机构及其从业人员的诚信信息记入资本市场诚信数据库和全国信用信息共享平台。国务院证券监督管理机构会同国务院有关部门依法建立健全私募基金管理人以及有关责任主体失信联合惩戒制度。国务院证券监督管理机构会同其他金融管理部门等国务院有关部门和省、自治区、直辖市人民政府建立私募基金监督管理信息共享、统计数据报送和风险处置协作机制。处置风险过程中，有关地方人民政府应当采取有效措施维护社会稳定。", "44": "未依照本条例第十条规定履行登记手续，使用\"基金\"或者\"基金管理\"字样或者近似名称进行投资活动的，责令改正，没收违法所得，并处违法所得1倍以上5倍以下的罚款；没有违法所得或者违法所得不足100万元的，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处3万元以上30万元以下的罚款。", "45": "私募基金管理人的股东、实际控制人、合伙人违反本条例第十二条规定的，责令改正，给予警告或者通报批评，没收违法所得，并处违法所得1倍以上5倍以下的罚款；没有违法所得或者违法所得不足100万元的，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。", "46": "私募基金管理人违反本条例第十三条规定的，责令改正；拒不改正的，给予警告或者通报批评，并处10万元以上100万元以下的罚款，责令其停止私募基金业务活动并予以公告。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。", "47": "违反本条例第十六条第二款规定，私募基金托管人未建立业务隔离机制的，责令改正，给予警告或者通报批评，并处5万元以上50万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。", "48": "违反本条例第十七条、第十八条、第二十条关于私募基金合格投资者管理和募集方式等规定的，没收违法所得，并处违法所得1倍以上5倍以下的罚款；没有违法所得或者违法所得不足100万元的，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处3万元以上30万元以下的罚款。", "49": "违反本条例第十九条规定，未向投资者充分揭示投资风险，并误导其投资与其风险识别能力和风险承担能力不匹配的私募基金产品的，给予警告或者通报批评，并处10万元以上30万元以下的罚款；情节严重的，责令其停止私募基金业务活动并予以公告。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上10万元以下的罚款。", "50": "违反本条例第二十二条第一款规定，私募基金管理人未对募集完毕的私募基金办理备案的，处10万元以上30万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处3万元以上10万元以下的罚款。", "51": "违反本条例第二十四条第二款规定，将私募基金财产用于经营或者变相经营资金拆借、贷款等业务，或者要求地方人民政府承诺回购本金的，责令改正，给予警告或者通报批评，没收违法所得，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。", "52": "违反本条例第二十六条规定，私募基金管理人未聘用具有相应从业经历的高级管理人员负责投资管理、风险控制、合规等工作，或者未建立从业人员投资申报、登记、审查、处置等管理制度的，责令改正，给予警告或者通报批评，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。", "53": "违反本条例第二十七条规定，私募基金管理人委托他人行使投资管理职责，或者委托不符合《证券投资基金法》规定的机构提供证券投资建议服务的，责令改正，给予警告或者通报批评，没收违法所得，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。", "54": "违反本条例第二十八条规定，私募基金管理人从事关联交易的，责令改正，给予警告或者通报批评，没收违法所得，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。", "55": "私募基金管理人、私募基金托管人及其从业人员有本条例第三十条所列行为之一的，责令改正，给予警告或者通报批评，没收违法所得，并处违法所得1倍以上5倍以下的罚款；没有违法所得或者违法所得不足100万元的，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。", "56": "私募基金管理人、私募基金托管人及其从业人员未依照本条例规定提供、报送相关信息，或者有本条例第三十二条所列行为之一的，责令改正，给予警告或者通报批评，没收违法所得，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。", "57": "私募基金服务机构及其从业人员违反法律、行政法规规定，未恪尽职守、勤勉尽责的，责令改正，给予警告或者通报批评，并处10万元以上30万元以下的罚款；情节严重的，责令其停止私募基金服务业务。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上10万元以下的罚款。", "58": "私募基金管理人、私募基金托管人、私募基金服务机构及其从业人员违反本条例或者国务院证券监督管理机构的有关规定，情节严重的，国务院证券监督管理机构可以对有关责任人员采取证券期货市场禁入措施。拒绝、阻碍国务院证券监督管理机构及其工作人员依法行使监督检查、调查职权，由国务院证券监督管理机构责令改正，处10万元以上100万元以下的罚款；构成违反治安管理行为的，由公安机关依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。", "59": "国务院证券监督管理机构、登记备案机构的工作人员玩忽职守、滥用职权、徇私舞弊或者利用职务便利索取或者收受他人财物的，依法给予处分；构成犯罪的，依法追究刑事责任。", "60": "违反本条例规定和基金合同约定，依法应当承担民事赔偿责任和缴纳罚款、被没收违法所得，其财产不足以同时支付时，先承担民事赔偿责任。", "61": "外商投资私募基金管理人的管理办法，由国务院证券监督管理机构会同国务院有关部门依照外商投资法律、行政法规和本条例制定。境外机构不得直接向境内投资者募集资金设立私募基金，但国家另有规定的除外。私募基金管理人在境外开展私募基金业务活动，应当符合国家有关规定。", "62": "本条例自2023年9月1日起施行。"}, "登记备案办法": {"8": "私募基金管理人应当具有……专职员工不少于5人。⚠️本条为**节选**，仅记录与\"专职员工不少于5人\"相关的内容；完整原文尚未取得，正式引用前须以amac.org.cn原文复核。", "17": "……控股股东、实际控制人应当合理区分各私募基金管理人的业务范围，并就业务风险隔离、避免同业化竞争、关联交易管理和防范利益冲突等内控制度作出合理有效安排。", "18": "同一控股股东、实际控制人控制两家以上私募基金管理人的，应当建立与所控制的私募基金管理人的管理规模、业务情况相适应的持续合规和风险管理体系，在保障私募基金管理人自主经营的前提下，加强对私募基金管理人的合规监督、检查……>⚠️上述第十七条、第十八条来源于律师事务所解读文章引述，**条号已核对但原文表述为节选**。正式用于脚注前建议以amac.org.cn原文复核。"}, "登记指引1号": {"9": "《登记备案办法》第八条第一款第四项规定的\"专职员工\"是指与私募基金管理人签订劳动合同并缴纳社保的正式员工，签订劳动合同或者劳务合同的外籍员工、退休返聘员工，以及国家机关、事业单位、政府及其授权机构控制的企业委派的高级管理人员。", "10": "私募基金管理人应当建立科学合理、运转有效的内部控制、风险控制和合规管理制度，包括运营风险控制、信息披露、机构内部交易记录、关联交易管理、防范内幕交易及利益输送、业务隔离和从业人员买卖证券申报等制度，以及私募基金宣传推介及募集、合格投资者适当性、保障资金安全、投资业务控制、公平交易、外包控制等制度。（本条录入内容为**第二款**全文；第一款原文尚未取得。）", "11": "私募基金管理人应当建立突发事件处理预案，对严重损害投资者利益、影响正常经营或者可能引发系统性风险的突发事件的处理机制作出明确安排。发生前述突发事件时，私募基金管理人应当按照预案妥善处理，并及时向注册地所在的中国证监会派出机构和协会报告。>**这份第十条第二款是\"必建制度清单\"最直接的依据**，制度模块映射表以此为主轴。"}, "运作指引": {"1": "为了加强私募证券投资基金自律管理，规范私募证券投资基金业务，保护投资者合法权益，促进私募基金行业健康发展，维护证券期货市场秩序，根据《中华人民共和国证券投资基金法》《中华人民共和国证券法》《中华人民共和国期货和衍生品法》《私募投资基金监督管理条例》《私募投资基金监督管理暂行办法》《私募投资基金登记备案办法》等，制定本指引。", "2": "在中华人民共和国境内依法设立的私募证券投资基金，其募集、投资、运作以及其他业务活动，适用本指引。", "3": "开展私募证券投资基金业务，应当遵守法律、行政法规、中国证券监督管理委员会（以下简称中国证监会）、证券期货交易场所及中国证券投资基金业协会（以下简称协会）等规定，履行诚实信用、谨慎勤勉的义务，遵循投资者利益优先原则，树立价值投资、长期投资、理性投资理念，建立健全公司治理、内部控制、合规管理及风险管理制度，制定合理稳健的投资策略，确保业务开展与资本实力、投资管理能力、信息技术及风险控制水平相匹配，有效防范和控制风险，不得损害国家利益、社会公共利益和他人合法权益。", "4": "私募证券投资基金的初始实缴募集资金规模不得低于1000万元，不得通过投资者短期赎回基金份额等方式，规避前述实缴规模要求。私募证券投资基金上一年度日均基金资产净值低于1000万元的，私募基金管理人应当在5个工作日内向投资者披露本条第三款的潜在影响及相关安排。私募证券投资基金上一年度日均基金资产净值低于500万元，或者连续60个交易日出现基金资产净值低于500万元情形的，应当停止申购并在5个工作日内向投资者披露；停止申购后连续120个交易日基金资产净值仍低于500万元的，应当进入清算程序。私募基金托管人应当配合执行并督促私募基金管理人及时按要求办理基金清算等事宜。", "5": "私募基金管理人、基金销售机构应当履行投资者适当性义务，向合格投资者推荐适当的产品。私募证券投资基金的风险等级应当与风险收益特征相匹配。私募证券投资基金投资者风险评级不得低于基金风险等级。", "6": "私募基金管理人、基金销售机构应当按要求披露私募证券投资基金及其业绩相关信息，披露的基金业绩信息包括但不限于存续期间完整的历史净值、历史规模、投资策略、投资经理等。除已履行特定对象确定程序的合格投资者、符合规定的基金评价机构外，私募基金管理人不得向不存在私募证券投资基金销售委托关系的机构或者个人提供基金净值等业绩相关信息。除私募基金管理人、与其签署该基金代销协议的基金销售机构外，任何机构和个人不得展示和传递基金净值等业绩相关信息，中国证监会、协会另有规定的除外。私募基金管理人、与其签署该基金代销协议的基金销售机构应当按照客观、真实、准确、完整的原则展示私募证券投资基金过往业绩，不得将规模小于1000万元、成立期限少于6个月的私募证券投资基金过往业绩用作宣传、销售、排名，不得以误导投资者为目的选择性展示部分私募证券投资基金业绩、私募证券投资基金部分运作周期的业绩，不得展示未经私募基金托管人复核的基金业绩，不得对少于6个月周期的基金业绩进行排名。基金投资者仅为私募基金管理人或者其股东、合伙人、实际控制人、员工的，私募基金管理人、基金销售机构在基金宣传、销售、排名时，应当一并披露该情况。", "7": "私募基金管理人可以设立存续期间办理申购、赎回的开放式私募证券投资基金或者存续期间不办理申购、赎回的封闭式私募证券投资基金。基金合同中约定的开放安排应当与私募证券投资基金的产品类型、投资策略以及资产组合的流动性等相匹配。封闭式私募证券投资基金的存续期限不得小于1年，并在基金合同中约定定期分红安排。封闭式私募证券投资基金不得接受开放式私募证券投资基金、资产管理产品投资，接受封闭式私募证券投资基金、资产管理产品投资时，应当确保上层基金、资产管理产品到期日晚于本基金到期日。开放式私募证券投资基金应当明确投资者申购、赎回的程序、时间、次数及限制事项。开放式私募证券投资基金至多每周开放一次申购、赎回，每次开放不得超过2天。基金合同中应当约定，投向AA级及以下信用债（可转债除外）、流动性受限资产合计超过基金净资产20%的，至多每季度开放一次申购、赎回，每次开放不得超过5天。开放式私募证券投资基金设置临时开放日的，应当符合中国证监会和协会的相关规定。私募基金管理人应当引导投资者关注基金长期业绩，强化对投资者短期投资行为的管理。基金合同中应当约定不少于3个月的份额锁定期或者与基金份额持有期限对应的短期赎回费用安排，收取的赎回费用应当归属基金财产。私募基金管理人及其员工跟投本管理人管理的私募证券投资基金的，其份额锁定期不得少于6个月。", "8": "私募证券投资基金的投资范围主要包括股票、债券、存托凭证、资产支持证券、期货合约、期权合约、互换合约、远期合约、证券投资基金份额，以及中国证监会认可的其他资产。", "9": "私募证券投资基金应当具有明确、合法的投资方向，具备清晰的投资策略与风险收益特征，确定所属产品类型，分为权益类、期货和衍生品类、混合类、固定收益类私募证券投资基金，以及私募证券投资母基金。", "10": "私募证券投资基金的基金名称、产品类型应当与基金合同约定的投资策略、投资品种、对冲工具等相匹配，投资运作应当遵循基金合同有关约定。", "11": "私募基金管理人及私募证券投资基金不得通过设置增强资金、安全垫、费用返还等方式调节基金收益或者亏损，不得以自有资金认购的基金份额先行承担亏损等形式提供风险补偿。私募证券投资基金接受资产管理产品投资或者私募基金管理人担任资产管理产品投资顾问的，私募基金管理人不得以自有资金、第三方资金直接或者间接为该资产管理产品提供风险补偿或者保本保收益安排。", "12": "私募证券投资基金应当采用资产组合的方式进行投资并符合下列要求，银行活期存款、国债、债券通用质押式回购、中央银行票据、政策性金融债、地方政府债券、公开募集基金等中国证监会、协会认可的投资品种除外：（一）单只私募证券投资基金投资于同一资产的资金，不得超过该基金净资产的25%；（二）同一私募基金管理人管理的全部私募证券投资基金投资于同一资产的资金，不得超过该资产的25%。符合前款第（一）项分散投资要求的私募证券投资基金投资单只私募基金的资金，可以不受前款第（二）项规定的投资比例限制。", "13": "符合下列条件之一的私募证券投资基金，可以不受本指引第十二条第一款规定的投资比例限制：（一）基金合同约定仅以战略配售、非公开发行、大宗交易、协议转让方式投资上市公司股票，全部投资者均为符合中国证监会规定的专业投资者且单个投资者投资金额不低于300万元（穿透认定）的封闭式私募证券投资基金；（二）基金合同约定将90%以上基金资产投资于符合本指引第十二条组合投资要求的单只私募基金的私募证券投资基金；（三）全部投资者均为符合中国证监会规定的专业投资者且单个投资者投资金额不低于1000万元（穿透认定）的封闭式私募证券投资基金；（四）中国证监会、协会规定的其他情形。", "14": "私募证券投资基金架构应当清晰、透明，不得通过设置复杂架构、多层嵌套等方式规避监管要求。私募证券投资基金接受其他私募基金、资产管理产品投资，或者投资于其他私募基金、资产管理产品的，应当符合法律、行政法规、中国证监会规定的投资层级要求。", "15": "私募证券投资基金的总资产不得超过该基金净资产的200%，不得通过场外衍生品等工具规避杠杆限制，不得参与场外配资。私募证券投资基金投向AA级及以下信用债（可转债除外）、流动性受限资产合计超过该基金净资产20%的，总资产不得超过该基金净资产的120%，全部投资者均为符合中国证监会规定的专业投资者且单个投资者投资金额不低于1000万元（穿透认定）的封闭式私募证券投资基金除外。", "16": "同一实际控制人控制的私募证券基金管理人的自有资金、管理的所有私募证券投资基金、担任投资顾问的资产管理产品合计持有单一上市公司发行的股票不得超过该上市公司可流通股票的30%，中国证监会、协会另有规定的除外。", "17": "私募证券投资基金开展场外衍生品交易的，应当以风险管理、资产配置为目标，以国务院金融管理部门认可的机构为交易对手方，并符合下列要求：（一）新增场外期权合约以及存续合约展期的，除仅开展商品类场外期权交易外，基金净资产不低于5000万元；向全部交易对手方缴纳的场外期权交易保证金和权利金合计不得超过基金净资产的25%；（二）新增收益互换合约以及存续合约展期的，基金净资产不低于1000万元；参与挂钩股票、股票指数等权益类收益互换的，向交易对手方缴纳的保证金比例不低于合约名义本金的50%；（三）参与证券公司等机构发行带敲入和敲出结构的场外期权或者收益凭证（如雪球结构衍生品）的合约名义本金不得超过基金净资产的25%，全部投资者均为符合中国证监会规定的专业投资者且单个投资者投资金额不低于1000万元（穿透认定）的封闭式私募证券投资基金除外；（四）私募证券投资基金及其投资者均不存在份额分级安排；（五）不得将场外衍生品交易异化为股票、债券等场内标的的杠杆融资工具，不得为基金销售机构向自然人投资者销售特定结构的场外衍生品提供通道服务，不得为投资者提供规避场外衍生品交易要求的通道服务。私募证券投资基金参与场外衍生品交易的，私募基金管理人应当在该基金下一估值日前将场外衍生品交易情况、交易文件等提供给私募基金托管人。私募基金管理人签订场外衍生品交易文件时，应当明确授权由交易对手方、相关交易的清算机构在该基金下一估值日前直接向私募基金托管人提供场外衍生品交易文件并持续提供估值信息。", "18": "私募基金管理人开展债券投资交易业务，应当审慎合理设置投资债券的发行人及所在地区、行业等集中度、价格偏离度、杠杆比例、主体评级、债项评级等风险控制指标，加强对债券交易的动态评估和风险管理。价格偏离度等指标出现异常情形时应当按照基金合同约定及时向投资者披露，并按要求向证券交易场所报告。私募基金管理人及其管理的私募证券投资基金、股东、合伙人、实际控制人、员工不得参与债券结构化发行，不得参与债券代持，不得直接或者变相收取债券发行人及第三方支付的承销服务、融资顾问、咨询服务、信用风险补偿等各种形式的费用或者保证金。", "19": "单只私募证券投资基金投资于同一债券的资金，不得超过该基金净资产的10%。私募基金管理人管理的所有私募证券投资基金投资于同一债券的数量，不得超过该债券存续数量的10%，因发行人行使赎回选择权或者进行债券购回，以及其他持有人行使回售选择权导致的被动超标除外。单只私募证券投资基金投资于同一发行人及其关联方发行的债券资金总额，不得超过基金净资产的25%。同一实际控制人控制的私募基金管理人管理的所有私募证券投资基金投资于同一发行人及其关联方发行的债券的总数量，不得超过相关债券存续数量的25%。私募证券投资基金开展债券质押式协议回购业务的，质押或者接受质押单一债券的集中度适用本条前两款规定，与单一交易对手方开展回购交易的金额不得超过基金净资产的10%，私募基金管理人应当在该基金下一估值日前将参与债券质押式协议回购业务的交易文件、交易对手方及质押标的等信息提供给私募基金托管人。国债、中央银行票据、政策性金融债、地方政府债券、可转换债券、可交换债券等中国证监会、协会认可的投资品种可以不受本条前三款规定的投资比例限制。", "20": "私募证券投资基金投资境外资产的，应当遵守跨境投资相关法律法规及业务规则。", "21": "主要开展程序化交易的私募证券投资基金，应当满足下列要求：（一）私募基金管理人应当就程序化交易制定专门的业务管理和合规风控制度，完善程序化交易指令审核和监控系统，防范和控制业务风险；（二）私募基金管理人用于程序化交易的技术系统应当具备证券期货交易场所规定的基本功能，按照要求进行充分测试，保障持续稳定运行；（三）私募基金管理人建立并有效执行程序化交易策略的研发、测试、验证、合规审查、上线等业务流程；（四）私募基金管理人建立健全流动性、持股比例集中度、杠杆、交易频率、期现匹配、风格暴露、瞬时大额成交等投资交易的风控制度并有效执行；（五）保存历史交易记录，算法或策略的文字说明等投资决策、交易涉及资料，保存期限自基金清算结束之日起不得少于20年；（六）按照证券期货交易场所程序化交易报告制度履行相关手续，不得以规避报告制度等监管要求为目的分拆私募证券投资基金；（七）因不可抗力、意外事件、重大技术故障、重大人为差错等突发性事件，可能引发重大异常波动或者影响证券期货交易正常进行的，私募基金管理人应当立即采取暂停交易、撤销委托等处置措施，并及时向其委托的证券公司或者期货公司报告；（八）中国证监会、协会、证券期货交易场所规定的其他要求。", "22": "受证券期货市场波动、证券发行人合并、私募证券投资基金规模变动等私募基金管理人之外的因素影响，导致私募证券投资基金的投资比例不符合本指引规定或者基金合同约定的，私募基金管理人应当在20个交易日内调整至符合要求。因资产流动性受限导致无法完成前述调整的，应当在相关资产可出售、可转让或者恢复交易后的20个交易日内调整至符合要求。私募证券投资基金根据本指引第十二条、第十九条要求开展投资时，可以按照买入成本与市值孰低法计算投资比例。", "23": "私募证券投资基金设定业绩报酬的，应当在基金合同中合理设定业绩报酬的计提方法、频率、比例，并与基金业绩表现挂钩。私募基金管理人应当与投资者利益保持一致，不得在合同中约定不公平或者不合理的业绩报酬相关条款，不得采用对自身明显有利或者过度激励的计提方式。私募证券投资基金只能采取一种业绩报酬计提方法，且该种计提方法应当基于单一基金份额的整体收益情况进行计算，不得对同一基金的不同策略分别计提业绩报酬，保证公平对待投资者。", "24": "开放式私募证券投资基金原则上不设置预警线、止损线。私募基金管理人、私募基金托管人应当按照要求向协会报送预警线、止损线相关情况。", "25": "开放式私募证券投资基金的基金合同中应当明确约定基金巨额赎回和连续巨额赎回的认定标准、赎回顺序、赎回价格确定、赎回款项支付、告知投资者方式，以及投资者大额赎回的预约申请等事宜，相关约定应当符合公平、合理的原则。私募基金管理人经与私募基金托管人协商，在确保公平对待投资者前提下，可以根据法律、行政法规、中国证监会和协会规定以及基金合同约定，采取延期办理巨额赎回申请、暂停接受赎回申请、延缓支付赎回款项、收取短期赎回费等流动性管理措施。", "26": "私募证券投资基金应当按照法律、行政法规、中国证监会等有关规定进行托管。存续私募证券投资基金未按照前款要求进行托管的，不得新增投资者、不得新增基金规模、不得展期，其年度财务报告应当经符合《中华人民共和国证券法》规定的会计师事务所审计。", "27": "私募基金托管人应当按照法律、行政法规、中国证监会、本指引有关规定，以及基金合同约定履行职责。私募基金托管人发现私募基金管理人的投资运作行为违反前述规定或者基金合同约定的，对投资运作指令应当予以拒绝，立即通知私募基金管理人，并在5个工作日内向中国证监会、协会报告。私募基金托管人发现私募基金管理人依据交易程序已经生效的投资指令违反法律、行政法规、本指引和其他有关规定的，或者违反基金合同约定的，应当立即通知私募基金管理人，并在5个工作日内向中国证监会、协会报告。私募基金托管人应当按照中国证监会、协会要求提供私募证券投资基金运作相关信息。", "28": "私募证券投资基金接受其他私募基金或者资产管理产品投资的，应当授权其私募基金托管人将经复核的基金估值信息提供给上层私募基金托管人。私募基金管理人应当授权基金服务机构将基金份额登记信息在基金份额确认后2个工作日内提供给该基金托管人。私募基金托管人、基金服务机构应当配合。", "29": "私募证券投资基金应当实行净值化管理，估值核算业务应当符合《企业会计准则》《中国证监会关于证券投资基金估值业务的指导意见》等有关规定，及时反映金融资产的收益和风险，并由私募基金托管人复核确认后再披露净值信息。", "30": "私募证券投资基金进入清算程序后，不得新增募集、不得新增投资，私募基金托管人、经纪商等服务机构应当予以监督及配合。", "31": "私募基金管理人应当建立从业人员进行证券、私募基金等投资的申报、登记、审查、处置等管理制度和廉洁从业规范，制定有效的事前防范体系、事中管控措施和事后追责机制，防止从业人员或者其他利益相关方违规从事投资，严格防范内幕交易、市场操纵、利用未公开信息交易、利益冲突和利益输送等不当行为，确保投资者合法权益不受侵害。", "32": "私募基金管理人应当建立公平交易制度及异常交易监控机制，公平对待所管理的不同私募证券投资基金，对投资交易行为进行监控、分析、评估、核查，监督投资交易的过程和结果，保证公平交易原则的实现，不得开展可能导致不公平交易和利益输送的交易行为。私募基金管理人应当严格控制同日反向交易，严格禁止可能导致不公平交易或者利益输送的同日反向交易。确因投资策略或者流动性等需要发生同日反向交易的，私募基金管理人应当要求投资经理提供决策依据，并留存记录备查。私募基金管理人及其从业人员的自有资金投资账户与其管理的私募证券投资基金或者作为投资顾问的资产管理产品之间发生的交易，适用本条前两款要求。", "33": "私募基金管理人应当在风险可测、可控、可承受的前提下开展自有资金投资，建立自有资金投资管理制度和外部投资者利益绑定机制，确保自有资金投资的安全性、流动性，不得影响私募基金管理人及其所管理私募证券投资基金的正常运营。自有资金通过独立账户、私募基金或者资产管理产品等进行投资运作的，应当与私募基金管理业务有效隔离，并按要求向协会进行报送。私募基金管理人应当公平对待自有资金投资与其管理的私募证券投资基金或者担任投资顾问的资产管理产品投资，不得利用资金、信息、技术、策略等优势为自有资金牟取不正当利益，防范利益冲突，严禁利益输送。私募基金管理人的员工、穿透后参与实际经营的自然人股东或者合伙人、自然人实际控制人，以及前述主体实际控制的资金开展证券、私募基金等投资的，适用本条前两款要求。", "34": "私募基金管理人应当建立保障信息技术系统安全、数据安全的风控机制和应急管理制度，确保网络和信息安全管理能力、风险控制能力、软硬件及人员配置与交易策略、业务规模、业务复杂程度等相匹配，确保信息技术系统持续稳定运行，不得影响证券期货交易场所信息系统安全。", "35": "私募基金管理人应当结合市场状况和自身管理能力制定并持续更新流动性风险应急预案，明确预案触发情景、应急程序与措施等。符合一定资产管理规模以上等条件的私募证券基金管理人应当持续建立健全流动性风险监测、预警与应急处置机制，每季度至少开展一次压力测试，并按要求向协会报送。", "36": "私募基金管理人等信息披露义务人应当按照法律、行政法规、中国证监会和协会规定以及基金合同的约定向投资者进行信息披露，并保证所披露信息的真实性、准确性、完整性和及时性。", "37": "符合一定资产管理规模以上等条件的私募证券基金管理人应当按要求提取风险准备金，主要用于弥补因私募基金管理人违法违规、违反合同约定、操作错误或者技术故障等给私募证券投资基金或者投资者造成的损失，具体要求由协会另行规定。", "38": "私募基金管理人开展私募证券投资基金业务不得通过场外衍生品、资产管理产品等规避私募基金监管要求。私募基金管理人应当履行受托管理职责，不得由投资者、第三方下达投资指令或者负责投资运作，不得为投资者、证券发行人、金融机构、其他私募基金管理人、资产管理产品以及其他私募基金等第三方提供规避投资范围、杠杆约束、投资者门槛等监管要求的通道服务。", "39": "私募基金管理人开展证券投资顾问业务的，应当参照本指引执行，不得通过担任投资顾问方式规避本指引相关规定。", "40": "私募基金管理人及其股东、合伙人、实际控制人、员工违反本指引要求的，协会可以按照规定采取书面警示、要求限期改正、公开谴责、暂停办理备案、限制相关业务活动、撤销私募基金管理人登记等自律管理或者纪律处分措施。私募基金管理人存在多只资产净值低于1000万元的私募证券投资基金，协会可以要求私募基金管理人说明情况；发现多只基金未实质开展投资业务且未合理说明的，协会可以根据有关规定暂停办理其私募基金备案。", "41": "本指引下列用语含义：（一）开放式私募证券投资基金：是指基金份额总额不固定，基金份额可以在基金合同约定的时间和场所申购或者赎回的基金。（二）封闭式私募证券投资基金：是指基金份额总额在基金合同期限内固定不变，基金份额持有人不得申请赎回的基金。（三）固定收益类私募证券投资基金：是指投资于存款、债券等债权类资产的比例不低于私募证券投资基金已投资产80%的基金，已投资产不包含现金管理工具（下同）。现金管理工具是指银行活期存款、国债、中央银行票据、政策性金融债、地方政府债券、货币市场基金等中国证监会认可的现金管理工具。（四）期货和衍生品类私募证券投资基金：是指投资于期货和衍生品的持仓合约价值的比例不低于私募证券投资基金已投资产80%，且期货和衍生品账户权益超过私募证券投资基金已投资产20%的基金。（五）权益类私募证券投资基金：是指投资于股票等股权类资产的比例不低于私募证券投资基金已投资产80%的基金。（六）混合类私募证券投资基金：是指投资于固定收益类、权益类、期货和衍生品类资产的比例不符合前三类基金标准的基金。（七）私募证券投资母基金：是指组合投资于其他证券投资基金的比例不低于该私募证券投资母基金已投资产80%的基金。（八）资产管理规模：是指私募基金管理人在管的已备案私募证券投资基金的净资产总值。（九）**同一资产**：1.标准化股权类资产按照单一上市公司公开发行的股票、存托凭证，视为同一资产；2.标准化债权类资产按照单只债券、中央银行票据、资产支持证券、非金融企业债务融资工具，视为同一资产；3.非标准化债权类资产（如证券公司发行的保本型收益凭证、质押式报价回购、质押式协议回购、标准化票据）按照同一\"融资主体\"及其关联方视为同一资产；4.基金类资产按照单只证券投资基金或者资产管理产品视为同一资产；5.**标准化期货和衍生品类资产按照单只期货或者期权合约视为同一资产**；6.场外衍生品类资产：（1）场外期权及证券公司发行的非保本型收益凭证按照同一\"交易对手方\"视为同一资产；（2）收益互换按照合约挂钩具体标的视为同一资产。（十）流动性受限资产：是指由于法律法规、监管、合同或操作障碍等原因无法以合理价格予以变现的资产，包括到期日在10个交易日以上的逆回购与银行定期存款（含协议约定有条件提前支取的银行存款）、资产支持证券（票据）、流动受限的新股以及非公开发行股票、停牌股票、因发行人债务违约无法进行转让或交易的债券和非金融企业债务融资工具等资产。（十一）关联方：本指引\"同一发行人及其关联方\"或者\"同一融资主体及其关联方\"，关联方按照《企业会计准则》的规定确定。（十二）场外衍生品交易文件：是指私募证券投资基金参与场外衍生品交易时，与交易对手方签署的衍生品交易主协议、补充协议、交易确认书以及履约保障协议等文件。", "42": "本指引自2024年8月1日起施行。"}, "适当性办法": {"1": "为了规范证券期货投资者适当性管理，维护投资者合法权益，根据《中华人民共和国证券法》（以下简称《证券法》）、《中华人民共和国证券投资基金法》（以下简称《证券投资基金法》）、《中华人民共和国期货和衍生品法》（以下简称《期货和衍生品法》）、《证券公司监督管理条例》《期货交易管理条例》及其他相关法律、行政法规，制定本办法。", "2": "向投资者销售公开或者非公开发行的证券、公开或者非公开募集的证券投资基金和股权投资基金（包括创业投资基金，以下简称基金）、公开或者非公开转让的期货及其他衍生产品，或者为投资者提供相关业务服务的，适用本办法。本办法所称投资者，包括《证券法》规定的投资者，《证券投资基金法》规定的投资人、基金份额持有人，以及《期货和衍生品法》规定的交易者等。", "3": "向投资者销售证券期货产品或者提供证券期货服务的机构（以下简称经营机构）应当遵守法律、行政法规、本办法及其他有关规定，在销售产品或者提供服务的过程中，勤勉尽责，审慎履职，全面了解投资者情况，深入调查分析产品或者服务信息，科学有效评估，充分揭示风险，基于投资者的不同风险承受能力以及产品或者服务的不同风险等级等因素，提出明确的适当性匹配意见，将适当的产品或者服务销售或者提供给适合的投资者，并对违法违规行为承担法律责任。", "4": "投资者应当在了解产品或者服务情况，听取经营机构适当性意见的基础上，根据自身能力审慎决策，独立承担投资风险。经营机构的适当性匹配意见不表明其对产品或者服务的风险和收益做出实质性判断或者保证。", "5": "中国证券监督管理委员会（以下简称中国证监会）及其派出机构依照法律、行政法规、本办法及其他相关规定，对经营机构履行适当性义务进行监督管理。证券期货交易场所、登记结算机构及中国证券业协会、中国期货业协会、中国证券投资基金业协会（以下统称行业协会）等自律组织对经营机构履行适当性义务进行自律管理。", "6": "经营机构向投资者销售产品或者提供服务时，应当了解投资者的下列信息：（一）自然人的姓名、住址、职业、年龄、联系方式，法人或者其他组织的名称、注册地址、办公地址、性质、资质及经营范围等基本信息；（二）收入来源和数额、资产、债务等财务状况；（三）投资相关的学习、工作经历及投资经验；（四）投资期限、品种、期望收益等投资目标；（五）风险偏好及可承受的损失；（六）诚信记录；（七）实际控制投资者的自然人和交易的实际受益人；（八）法律法规、自律规则规定的投资者准入要求相关信息；（九）其他必要信息。", "7": "投资者分为普通投资者与专业投资者。普通投资者在信息告知、风险警示、适当性匹配等方面享有特别保护。", "8": "符合下列条件之一的是专业投资者：（一）经有关金融监管部门批准设立的金融机构，包括证券公司、期货公司、基金管理公司及其子公司、商业银行、保险公司、信托公司、财务公司等；经行业协会备案或者登记的证券公司子公司、期货公司子公司、私募基金管理人。（二）上述机构面向投资者发行的理财产品，包括但不限于证券公司资产管理产品、基金管理公司及其子公司产品、期货公司资产管理产品、银行理财产品、保险产品、信托产品、经行业协会备案的私募基金。（三）社会保障基金、企业年金等养老基金，慈善基金等社会公益基金，合格境外机构投资者（QFII）、人民币合格境外机构投资者（RQFII）。（四）同时符合下列条件的法人或者其他组织：1.最近1年末净资产不低于2000万元；2.最近1年末金融资产不低于1000万元；3.具有2年以上证券、基金、期货、黄金、外汇等投资经历。（五）同时符合下列条件的自然人：1.金融资产不低于500万元，或者最近3年个人年均收入不低于50万元；2.具有2年以上证券、基金、期货、黄金、外汇等投资经历，或者具有2年以上金融产品设计、投资、风险管理及相关工作经历，或者属于本条第（一）项规定的专业投资者的高级管理人员、获得职业资格认证的从事金融相关业务的注册会计师和律师。前款所称金融资产，是指银行存款、股票、债券、基金份额、资产管理计划、银行理财产品、信托计划、保险产品、期货及其他衍生产品等。", "9": "经营机构可以根据专业投资者的业务资格、投资实力、投资经历等因素，对专业投资者进行细化分类和管理。", "10": "专业投资者之外的投资者为普通投资者。经营机构应当按照有效维护投资者合法权益的要求，综合考虑收入来源、资产状况、债务、投资知识和经验、风险偏好、诚信状况等因素，确定普通投资者的风险承受能力，对其进行细化分类和管理。", "11": "普通投资者和专业投资者在一定条件下可以互相转化。符合本办法第八条第（四）、（五）项规定的专业投资者，可以书面告知经营机构选择成为普通投资者，经营机构应当对其履行相应的适当性义务。符合下列条件之一的普通投资者可以申请转化成为专业投资者，但经营机构有权自主决定是否同意其转化：（一）最近1年末净资产不低于1000万元，最近1年末金融资产不低于500万元，且具有1年以上证券、基金、期货、黄金、外汇等投资经历的除专业投资者外的法人或其他组织；（二）金融资产不低于300万元或者最近3年个人年均收入不低于30万元，且具有1年以上证券、基金、期货、黄金、外汇等投资经历或者1年以上金融产品设计、投资、风险管理及相关工作经历的自然人投资者。", "12": "普通投资者申请成为专业投资者应当以书面形式向经营机构提出申请并确认自主承担可能产生的风险和后果，提供相关证明材料。经营机构应当通过追加了解信息、投资知识测试或者模拟交易等方式对投资者进行谨慎评估，确认其符合前条要求，说明对不同类别投资者履行适当性义务的差别，警示可能承担的投资风险，告知申请的审查结果及其理由。", "13": "经营机构应当告知投资者，其根据本办法第六条规定所提供的信息发生重要变化、可能影响分类的，应及时告知经营机构。经营机构应当建立投资者评估数据库并及时更新，充分使用已了解信息和已有评估结果，避免重复采集，提高评估效率。", "14": "中国证监会、自律组织在针对特定市场、产品或者服务制定规则时，可以考虑风险性、复杂性以及投资者的认知难度等因素，从资产规模、收入水平、风险识别能力和风险承担能力、投资认购最低金额等方面，规定投资者准入要求。投资者准入要求包含资产指标的，应当规定投资者在购买产品或者接受服务前一定时期内符合该指标。现有市场、产品或者服务规定投资者准入要求的，应当符合前款规定。", "15": "经营机构应当了解所销售产品或者所提供服务的信息，根据风险特征和程度，对销售的产品或者提供的服务划分风险等级。", "16": "划分产品或者服务风险等级时应当综合考虑以下因素：（一）流动性；（二）到期时限；（三）杠杆情况；（四）结构复杂性；（五）投资单位产品或者相关服务的最低金额；（六）投资方向和投资范围；（七）募集方式；（八）发行人等相关主体的信用状况；（九）同类产品或者服务过往业绩；（十）其他因素。涉及投资组合的产品或者服务，应当按照产品或者服务整体风险等级进行评估。", "17": "产品或者服务存在下列因素的，应当审慎评估其风险等级：（一）存在本金损失的可能性，因杠杆交易等因素容易导致本金大部分或者全部损失的产品或者服务；（二）产品或者服务的流动变现能力，因无公开交易市场、参与投资者少等因素导致难以在短期内以合理价格顺利变现的产品或者服务；（三）产品或者服务的可理解性，因结构复杂、不易估值等因素导致普通人难以理解其条款和特征的产品或者服务；（四）产品或者服务的募集方式，涉及面广、影响力大的公募产品或者相关服务；（五）产品或者服务的跨境因素，存在市场差异、适用境外法律等情形的跨境发行或者交易的产品或者服务；（六）自律组织认定的高风险产品或者服务；（七）其他有可能构成投资风险的因素。", "18": "经营机构应当根据产品或者服务的不同风险等级，对其适合销售产品或者提供服务的投资者类型作出判断，根据投资者的不同分类，对其适合购买的产品或者接受的服务作出判断。", "19": "经营机构告知投资者不适合购买相关产品或者接受相关服务后，投资者主动要求购买风险等级高于其风险承受能力的产品或者接受相关服务的，经营机构在确认其不属于风险承受能力最低类别的投资者后，应当就产品或者服务风险高于其承受能力进行特别的书面风险警示，投资者仍坚持购买的，可以向其销售相关产品或者提供相关服务。", "20": "经营机构向普通投资者销售高风险产品或者提供相关服务，应当履行特别的注意义务，包括制定专门的工作程序，追加了解相关信息，告知特别的风险点，给予普通投资者更多的考虑时间，或者增加回访频次等。", "21": "经营机构应当根据投资者和产品或者服务的信息变化情况，主动调整投资者分类、产品或者服务分级以及适当性匹配意见，并告知投资者上述情况。", "22": "禁止经营机构进行下列销售产品或者提供服务的活动：（一）向不符合准入要求的投资者销售产品或者提供服务；（二）向投资者就不确定事项提供确定性的判断，或者告知投资者有可能使其误认为具有确定性的意见；（三）向普通投资者主动推介风险等级高于其风险承受能力的产品或者服务；（四）向普通投资者主动推介不符合其投资目标的产品或者服务；（五）向风险承受能力最低类别的投资者销售或者提供风险等级高于其风险承受能力的产品或者服务；（六）其他违背适当性要求，损害投资者合法权益的行为。", "23": "经营机构向普通投资者销售产品或者提供服务前，应当告知下列信息：（一）可能直接导致本金亏损的事项；（二）可能直接导致超过原始本金损失的事项；（三）因经营机构的业务或者财产状况变化，可能导致本金或者原始本金亏损的事项；（四）因经营机构的业务或者财产状况变化，影响客户判断的重要事由；（五）限制销售对象权利行使期限或者可解除合同期限等全部限制内容；（六）本办法第二十九条规定的适当性匹配意见。", "24": "经营机构对投资者进行告知、警示，内容应当真实、准确、完整，不存在虚假记载、误导性陈述或者重大遗漏，语言应当通俗易懂；告知、警示应当采用书面形式送达投资者，并由其确认已充分理解和接受。", "25": "经营机构通过营业网点向普通投资者进行本办法第十二条、第二十条、第二十一条和第二十三条规定的告知、警示，应当全过程录音或者录像；通过互联网等非现场方式进行的，经营机构应当完善配套留痕安排，由普通投资者通过符合法律、行政法规要求的电子方式进行确认。", "26": "经营机构委托其他机构销售本机构发行的产品或者提供服务，应当审慎选择受托方，确认受托方具备代销相关产品或者提供服务的资格和落实相应适当性义务要求的能力，应当制定并告知代销方所委托产品或者提供服务的适当性管理标准和要求，代销方应当严格执行，但法律、行政法规、中国证监会其他规章另有规定的除外。", "27": "经营机构代销其他机构发行的产品或者提供相关服务，应当在合同中约定要求委托方提供的信息，包括本办法第十六条、第十七条规定的产品或者服务分级考虑因素等，自行对该信息进行调查核实，并履行投资者评估、适当性匹配等适当性义务。委托方不提供规定的信息、提供信息不完整的，经营机构应当拒绝代销产品或者提供服务。", "28": "对在委托销售中违反适当性义务的行为，委托销售机构和受托销售机构应当依法承担相应法律责任，并在委托销售合同中予以明确。", "29": "经营机构应当制定适当性内部管理制度，明确投资者分类、产品或者服务分级、适当性匹配的具体依据、方法、流程等，严格按照内部管理制度进行分类、分级，定期汇总分类、分级结果，并对每名投资者提出匹配意见。经营机构应当制定并严格落实与适当性内部管理有关的限制不匹配销售行为、客户回访检查、评估与销售隔离等风控制度，以及培训考核、执业规范、监督问责等制度机制，不得采取鼓励不适当销售的考核激励措施，确保从业人员切实履行适当性义务。", "30": "经营机构应当每半年开展一次适当性自查，形成自查报告。发现违反本办法规定的问题，应当及时处理并主动报告住所地中国证监会派出机构。", "31": "鼓励经营机构将投资者分类政策、产品或者服务分级政策、自查报告在公司网站或者符合中国证监会规定条件的媒体进行披露。", "32": "经营机构应当按照相关规定妥善保存其履行适当性义务的相关信息资料，防止泄露或者被不当利用，接受中国证监会及其派出机构和自律组织的检查。**对匹配方案、告知警示资料、录音录像资料、自查报告等的保存期限不得少于20年。**", "33": "投资者购买产品或者接受服务，按规定需要提供信息的，所提供的信息应当真实、准确、完整。投资者根据本办法第六条规定所提供的信息发生重要变化、可能影响其分类的，应当及时告知经营机构。投资者不按照规定提供相关信息，提供信息不真实、不准确、不完整的，应当依法承担相应法律责任，经营机构应当告知其后果，并拒绝向其销售产品或者提供服务。", "34": "经营机构应当妥善处理适当性相关的纠纷，与投资者协商解决争议，采取必要措施支持和配合投资者提出的调解。经营机构履行适当性义务存在过错并造成投资者损失的，应当依法承担相应法律责任。经营机构与普通投资者发生纠纷的，经营机构应当提供相关资料，证明其已向投资者履行相应义务。", "35": "中国证监会及其派出机构在监管中应当审核或者关注产品或者服务的适当性安排，对适当性制度落实情况进行检查，督促经营机构严格落实适当性义务，强化适当性管理。", "36": "证券期货交易场所应当制定完善本市场相关产品或者服务的适当性管理自律规则。行业协会应当制定完善会员落实适当性管理要求的自律规则，制定并定期更新本行业的产品或者服务风险等级名录以及本办法第十九条、第二十二条规定的风险承受能力最低的投资者类别，供经营机构参考。经营机构评估相关产品或者服务的风险等级不得低于名录规定的风险等级。证券期货交易场所、行业协会应当督促、引导会员履行适当性义务，对备案产品或者相关服务应当重点关注高风险产品或者服务的适当性安排。", "37": "经营机构违反本办法规定的，中国证监会及其派出机构可以对经营机构及其直接负责的主管人员和其他直接责任人员，采取责令改正、监管谈话、出具警示函等监督管理措施。", "38": "证券公司、期货公司违反本办法规定，存在较大风险或者风险隐患的，中国证监会及其派出机构可以按照《证券法》第一百四十条、《期货和衍生品法》第七十三条、《证券公司监督管理条例》第七十条、《期货交易管理条例》第五十五条的规定，采取监督管理措施。", "39": "违反本办法第六条、第十八条、第十九条、第二十条、第二十一条、第二十二条第（三）项至第（六）项、第二十三条、第二十四条、第三十三条规定的，按照《证券法》第一百九十八条、《证券投资基金法》第一百三十七条、《期货和衍生品法》第一百三十五条、《证券公司监督管理条例》第八十四条、《期货交易管理条例》第六十七条予以处理。", "40": "违反本办法第二十二条第（一）项至第（二）项、第二十六条、第二十七条规定的，按照《证券投资基金法》第一百三十五条、《期货和衍生品法》第一百三十五条、《证券公司监督管理条例》第八十三条、《期货交易管理条例》第六十六条予以处理。", "41": "经营机构有下列情形之一的，给予警告，并处以3万元以下罚款；对直接负责的主管人员和其他直接责任人员，给予警告，并处以3万元以下罚款：（一）违反本办法第十条，未按规定对普通投资者进行细化分类和管理的；（二）违反本办法第十一条、第十二条，未按规定进行投资者类别转化的；（三）违反本办法第十三条，未建立或者更新投资者评估数据库的；（四）违反本办法第十五条，未按规定了解所销售产品或者所提供服务信息或者履行分级义务的；（五）违反本办法第十六条、第十七条，未按规定划分产品或者服务风险等级的；（六）违反本办法第二十五条，未按规定录音录像或者采取配套留痕安排的；（七）违反本办法第二十九条，未按规定制定或者落实适当性内部管理制度和相关制度机制的；（八）违反本办法第三十条，未按规定开展适当性自查的；（九）违反本办法第三十二条，未按规定妥善保存相关信息资料的；（十）违反本办法第六条、第十八条至第二十四条、第二十六条、第二十七条、第三十三条规定，未构成《证券法》第一百九十八条，《证券投资基金法》第一百三十五条、第一百三十七条，《期货和衍生品法》第一百三十五条，《证券公司监督管理条例》第八十三条、第八十四条，《期货交易管理条例》第六十六条、第六十七条规定情形的。", "42": "经营机构从业人员违反相关法律法规和本办法规定，情节严重的，中国证监会可以依法采取市场禁入的措施。", "43": "本办法自2017年7月1日起施行。"}}, "modules": [{"id": "01", "name": "内部控制基本制度", "kind": "必建", "trigger": null, "duty": "统筹内部控制体系的建立、维护与持续评价", "clauses": [{"t": "{公司}应当结合自身具体情况，建立健全内部控制机制，明确内部控制职责，完善内部控制措施，强化内部控制保障，持续开展内部控制评价和监督。", "r": [["内控指引", 3]]}, {"t": "{最高权力机构}对建立内部控制制度和维持其有效性承担最终责任，经营层对内部控制制度的有效执行承担责任。", "r": [["内控指引", 3]]}, {"t": "内部控制应当覆盖各项业务、各个部门和各级人员，并涵盖资金募集、投资研究、投资运作、运营保障和信息披露等主要环节。", "r": [["内控指引", 5, "（一）"]]}, {"t": "各部门和岗位职责应当保持相对独立，基金财产、管理人固有财产、其他财产的运作应当分离。", "r": [["内控指引", 5, "（四）"]]}, {"t": "内部控制应当与{公司}的管理规模和员工人数相匹配，以合理的成本控制达到最佳的内部控制效果。", "r": [["内控指引", 5, "（五）"]]}, {"t": "{合规风控部}应当每年至少一次评价内部控制的有效性，并随法律法规调整及经营战略、方针、理念等内外部环境变化同步修订本制度。", "r": [["内控指引", 5, "（六）"], ["内控指引", 27]]}, {"t": "本制度及{公司}其他内部控制制度应当按照要求在中国证券投资基金业协会私募基金登记备案系统填报及上传。", "r": [["内控指引", 29]]}]}, {"id": "02", "name": "合规管理制度", "kind": "必建", "trigger": null, "duty": "合规审查、合规培训、制度执行监督", "clauses": [{"t": "{公司}应当设置负责合规风控的高级管理人员（{合规风控负责人}），独立履行对内部控制监督、检查、评价、报告和建议的职能。", "r": [["内控指引", 12]]}, {"t": "{合规风控负责人}因失职渎职导致内部控制失效造成重大损失的，应当承担相关责任。", "r": [["内控指引", 12]]}, {"t": "{公司}应当牢固树立合法合规经营的理念和风险控制优先的意识，每年组织不少于一次全体从业人员合规与专业能力培训，培养从业人员的合规与风险意识。", "r": [["内控指引", 7], ["私募条例", 3]]}, {"t": "从业人员应当遵守法律、行政法规规定，恪守职业道德和行为规范，按照规定接受合规和专业能力培训。", "r": [["私募条例", 3]]}, {"t": "{合规风控部}应当对内部控制制度的执行情况进行定期和不定期的检查、监督及评价，排查缺陷并及时改进。", "r": [["内控指引", 27]]}, {"t": "{公司}应当建立从业人员进行证券、私募基金等投资的申报、登记、审查、处置等管理制度和廉洁从业规范，制定有效的事前防范体系、事中管控措施和事后追责机制。", "r": [["运作指引", 31]]}]}, {"id": "03", "name": "风险管理制度", "kind": "必建", "trigger": null, "duty": "风险识别、评估、监控与报告", "clauses": [{"t": "{公司}应当建立科学的风险评估体系，对内外部风险进行识别、评估和分析，及时防范和化解风险。", "r": [["内控指引", 13]]}, {"t": "{合规风控部}应当及时识别、系统分析经营活动中与内部控制目标相关的风险，合理确定风险应对策略。", "r": [["内控指引", 6, "（二）"]]}, {"t": "{公司}应当结合市场状况和自身管理能力制定并持续更新流动性风险应急预案，明确预案触发情景、应急程序与措施。", "r": [["运作指引", 35]]}, {"t": "{合规风控部}应当于每个交易日监控持仓比例、集中度、杠杆水平等风险控制指标，发现异常的当日报告{总经理}与{合规风控负责人}。", "r": [["内控指引", 13], ["运作指引", 35]]}]}, {"id": "04", "name": "授权管理制度", "kind": "必建", "trigger": null, "duty": "授权标准与程序的制定、执行与复核", "clauses": [{"t": "授权控制应当贯穿于{公司}资金募集、投资研究、投资运作、运营保障和信息披露等主要环节的始终，{公司}应当建立健全授权标准和程序。", "r": [["内控指引", 15]]}, {"t": "各部门应当有合理及明确的授权分工，操作相互独立。", "r": [["内控指引", 10]]}, {"t": "授权权限以《授权权限表》形式明确，由{总经理}签发，每年复核一次；超出授权权限的事项须提交{最高权力机构}或{投资决策委员会}审议。", "r": [["内控指引", 15]]}]}, {"id": "05", "name": "投资决策管理制度", "kind": "必建", "trigger": null, "duty": "投资方案形成、合规审查、决策与指令下达", "clauses": [{"t": "{公司}应当建立健全投资业务控制，保证投资决策严格按照法律法规规定，符合基金合同所规定的投资目标、投资范围、投资策略、投资组合和投资限制等要求。", "r": [["内控指引", 20]]}, {"t": "{公司}应当聘用具有相应从业经历的高级管理人员负责投资管理、风险控制、合规等工作。", "r": [["私募条例", 26]]}, {"t": "投资决策须依下列流程进行并留痕：{研究部}出具研究报告并维护投资池；{投资部}形成投资方案；{合规风控部}出具书面合规意见；投资经理在授权权限内决策或提交{投资决策委员会}审议；{投资部}向{交易部}下达书面投资指令；{交易部}执行并反馈成交结果。", "r": [["内控指引", 14], ["内控指引", 20]]}, {"t": "未经{合规风控部}合规审查的投资方案，不得进入决策程序。", "r": [["内控指引", 20]]}, {"t": "{公司}不得将投资管理职责委托他人行使；委托其他机构提供证券投资建议服务的，接受委托的机构应当为《证券投资基金法》规定的基金投资顾问机构。", "r": [["私募条例", 27]]}, {"t": "基金的基金名称、产品类型应当与基金合同约定的投资策略、投资品种、对冲工具等相匹配，投资运作应当遵循基金合同有关约定。", "r": [["运作指引", 10]]}]}, {"id": "06", "name": "研究管理制度", "kind": "必建", "trigger": null, "duty": "研究支持、投资池维护、研究报告管理", "clauses": [{"t": "{公司}应当建立科学严谨的业务操作流程，利用部门分设、岗位分设、外包、托管等方式实现业务流程的控制。", "r": [["内控指引", 14]]}, {"t": "{研究部}出具的研究报告应当载明投资逻辑、风险因素与结论依据，并作为投资决策的书面支撑材料归档保存。", "r": [["内控指引", 14], ["内控指引", 20]]}, {"t": "{研究部}负责建立并维护投资池，投资池的调整应当形成书面记录。", "r": [["内控指引", 20]]}]}, {"id": "07", "name": "交易管理制度", "kind": "必建", "trigger": null, "duty": "指令执行、成交反馈、交易记录留痕", "clauses": [{"t": "{交易部}应当与{投资部}岗位分设，投资经理与交易员不得由同一人担任，实现投资决策与交易执行相互分离。", "r": [["内控指引", 10], ["内控指引", 14]]}, {"t": "{交易部}应当依据书面投资指令执行交易，不得接受口头指令；成交结果应当于当日反馈{投资部}并留痕。", "r": [["内控指引", 14], ["运作指引", 32]]}, {"t": "{公司}应当建立机构内部交易记录制度，完整保存交易指令、成交回执、委托记录等资料。", "r": [["登记指引1号", 10]]}, {"t": "{交易部}执行交易时应当注明私募基金名称，在以{公司}名义开立账户、列入所投资企业股东名册或者持有其他私募基金财产时，应当注明私募基金名称。", "r": [["私募条例", 21]]}]}, {"id": "08", "name": "公平交易制度", "kind": "必建", "trigger": null, "duty": "公平交易监控、异常交易识别、同日反向交易管理", "clauses": [{"t": "{公司}应当建立公平交易制度及异常交易监控机制，公平对待所管理的不同私募证券投资基金，不得开展可能导致不公平交易和利益输送的交易行为。", "r": [["运作指引", 32], ["内控指引", 19]]}, {"t": "{公司}应当严格控制同日反向交易，严格禁止可能导致不公平交易或者利益输送的同日反向交易。", "r": [["运作指引", 32]]}, {"t": "确因投资策略或者流动性等需要发生同日反向交易的，{公司}应当要求投资经理提供决策依据，并留存记录备查。", "r": [["运作指引", 32]]}, {"t": "{公司}管理的各基金之间发生同向或反向交易的，应当按价格优先、时间优先、比例分配原则执行，不得人为安排成交顺序使特定基金获益。", "r": [["内控指引", 19]]}, {"t": "{公司}及其从业人员的自有资金投资账户与其管理的私募证券投资基金之间发生的交易，适用本制度。", "r": [["运作指引", 32], ["运作指引", 33]]}]}, {"id": "09", "name": "财产分离与资金安全保障制度", "kind": "必建", "trigger": null, "duty": "财产独立运作、分别核算、资金安全", "clauses": [{"t": "{公司}应当建立完善的财产分离制度，私募基金财产与私募基金管理人固有财产之间、不同私募基金财产之间、私募基金财产和其他财产之间应当实行独立运作，分别核算。", "r": [["内控指引", 18]]}, {"t": "{公司}应当对所管理的不同私募基金财产分别管理、分别记账，进行投资。", "r": [["私募条例", 11]]}, {"t": "私募基金财产独立于{公司}、私募基金托管人的固有财产。私募基金财产的债务由私募基金财产本身承担，但法律另有规定的除外。", "r": [["私募条例", 4]]}, {"t": "{公司}及其从业人员不得将其固有财产或者他人财产混同于私募基金财产，不得侵占、挪用私募基金财产。", "r": [["私募条例", 30]]}, {"t": "自行募集的，{公司}应当设置有效机制，切实保障募集结算资金安全。", "r": [["内控指引", 16]]}]}, {"id": "10", "name": "关联交易管理制度", "kind": "必建", "trigger": null, "duty": "关联方识别、关联交易审查与披露", "clauses": [{"t": "{公司}应当建立健全关联交易管理制度，不得以私募基金财产与关联方进行不正当交易或者利益输送，不得通过多层嵌套或者其他方式进行隐瞒。", "r": [["私募条例", 28]]}, {"t": "{公司}运用私募基金财产与自己、投资者、所管理的其他私募基金、其实际控制人控制的其他私募基金管理人管理的私募基金，或者与其有重大利害关系的其他主体进行交易的，应当履行基金合同约定的决策程序，并及时向投资者和私募基金托管人提供相关信息。", "r": [["私募条例", 28]]}, {"t": "{公司}应当健全治理结构，防范不正当关联交易、利益输送和内部人控制风险，保护投资者利益和自身合法权益。", "r": [["内控指引", 9]]}, {"t": "关联方按照《企业会计准则》的规定确定。", "r": [["运作指引", 41]]}]}, {"id": "11", "name": "防范内幕交易、利益输送及从业人员证券投资申报制度", "kind": "必建", "trigger": null, "duty": "从业人员投资申报、内幕信息管控、利益冲突排查", "clauses": [{"t": "{公司}应当遵循投资者利益优先原则，建立从业人员投资申报、登记、审查、处置等管理制度，防范利益输送和利益冲突。", "r": [["私募条例", 26]]}, {"t": "从业人员进行证券、私募基金等投资的，应当在投资前向{合规风控部}申报，经审查同意后方可实施，并登记备案。", "r": [["私募条例", 26], ["运作指引", 31]]}, {"t": "{公司}及其从业人员不得泄露因职务便利获取的未公开信息，不得利用该信息从事或者明示、暗示他人从事相关的证券、期货交易活动。", "r": [["私募条例", 30]]}, {"t": "{公司}应当严格防范内幕交易、市场操纵、利用未公开信息交易、利益冲突和利益输送等不当行为，确保投资者合法权益不受侵害。", "r": [["运作指引", 31]]}, {"t": "{公司}应当建立健全相关机制，防范管理的各私募基金之间的利益输送和利益冲突，公平对待管理的各私募基金。", "r": [["内控指引", 19]]}]}, {"id": "12", "name": "业务隔离制度", "kind": "必建", "trigger": null, "duty": "防火墙设置、业务隔离、冲突业务排查", "clauses": [{"t": "{公司}组织结构应当体现职责明确、相互制约的原则，建立必要的防火墙制度与业务隔离制度，各部门有合理及明确的授权分工，操作相互独立。", "r": [["内控指引", 10]]}, {"t": "{公司}应当遵循专业化运营原则，主营业务清晰，不得兼营与私募基金管理无关或存在利益冲突的其他业务。", "r": [["内控指引", 8]]}, {"t": "{公司}自有资金通过独立账户、私募基金或者资产管理产品等进行投资运作的，应当与私募基金管理业务有效隔离，并按要求向协会进行报送。", "r": [["运作指引", 33]]}]}, {"id": "13", "name": "信息披露制度", "kind": "必建", "trigger": null, "duty": "信息编制、审核、披露与报送", "clauses": [{"t": "{公司}应当建立健全信息披露控制，维护信息沟通渠道的畅通，保证向投资者、监管机构及中国证券投资基金业协会所披露信息的真实性、准确性、完整性和及时性，不存在虚假记载、误导性陈述或重大遗漏。", "r": [["内控指引", 25]]}, {"t": "{公司}等信息披露义务人应当按照法律、行政法规、中国证监会和协会规定以及基金合同的约定向投资者进行信息披露，并保证所披露信息的真实性、准确性、完整性和及时性。", "r": [["运作指引", 36]]}, {"t": "{公司}、私募基金托管人及其从业人员提供、报送的信息不得有虚假记载、误导性陈述或者重大遗漏，不得对投资业绩进行预测，不得向投资者承诺投资本金不受损失或者承诺最低收益。", "r": [["私募条例", 32]]}, {"t": "披露的基金业绩信息包括但不限于存续期间完整的历史净值、历史规模、投资策略、投资经理等；不得展示未经私募基金托管人复核的基金业绩。", "r": [["运作指引", 6]]}, {"t": "不得将规模小于1000万元、成立期限少于6个月的私募证券投资基金过往业绩用作宣传、销售、排名；不得对少于6个月周期的基金业绩进行排名。", "r": [["运作指引", 6]]}, {"t": "{公司}在资金募集、投资运作过程中，应当按照规定和基金合同约定向投资者提供信息。", "r": [["私募条例", 31]]}]}, {"id": "14", "name": "合格投资者适当性制度", "kind": "必建", "trigger": null, "duty": "投资者分类、产品分级、适当性匹配、双录与自查", "clauses": [{"t": "{公司}应当建立合格投资者适当性制度，向合格投资者推荐适当的产品。", "r": [["内控指引", 16], ["登记指引1号", 10]]}, {"t": "私募证券投资基金投资者风险评级不得低于基金风险等级，风险等级应当与风险收益特征相匹配。", "r": [["运作指引", 5]]}, {"t": "{市场部}向投资者销售产品时应当了解投资者的基本信息、财务状况、投资经验、投资目标、风险偏好、诚信记录、实际受益人的信息。", "r": [["适当性办法", 6]]}, {"t": "投资者分为普通投资者与专业投资者，普通投资者在信息告知、风险警示、适当性匹配等方面享有特别保护。", "r": [["适当性办法", 7]]}, {"t": "{公司}应当了解所销售产品的信息，根据风险特征和程度划分风险等级，综合考虑流动性、到期时限、杠杆情况、结构复杂性等因素。", "r": [["适当性办法", 15], ["适当性办法", 16]]}, {"t": "{公司}不得向普通投资者主动推介风险等级高于其风险承受能力的产品或者服务，不得向风险承受能力最低类别的投资者销售风险等级高于其风险承受能力的产品。", "r": [["适当性办法", 22]]}, {"t": "{公司}向普通投资者销售产品前应当告知可能直接导致本金亏损的事项、可能直接导致超过原始本金损失的事项等六项信息，并采用书面形式送达投资者。", "r": [["适当性办法", 23], ["适当性办法", 24]]}, {"t": "通过营业网点向普通投资者进行告知、警示的，应当全过程录音或者录像；通过互联网等非现场方式进行的，应当完善配套留痕安排。", "r": [["适当性办法", 25]]}, {"t": "{公司}应当向投资者充分揭示投资风险，根据投资者的风险识别能力和风险承担能力匹配不同风险等级的私募基金产品。", "r": [["私募条例", 19]]}, {"t": "{公司}不得采取将私募基金份额或者收益权进行拆分转让等方式，降低合格投资者标准。", "r": [["私募条例", 18]]}, {"t": "{公司}应当每半年开展一次适当性自查，形成自查报告。", "r": [["适当性办法", 30]]}]}, {"id": "15", "name": "宣传推介与募集管理制度", "kind": "必建", "trigger": null, "duty": "募集推介材料管理、募集行为规范、备案", "clauses": [{"t": "{公司}应当自行募集资金，不得委托他人募集资金，但国务院证券监督管理机构另有规定的除外。", "r": [["私募条例", 17]]}, {"t": "私募基金不得向合格投资者以外的单位和个人募集或者转让；不得向为他人代持的投资者募集或者转让。", "r": [["私募条例", 20]]}, {"t": "不得通过报刊、电台、电视台、互联网等大众传播媒介，电话、短信、即时通讯工具、电子邮件、传单，或者讲座、报告会、分析会等方式向不特定对象宣传推介。", "r": [["私募条例", 20]]}, {"t": "不得以虚假、片面、夸大等方式宣传推介；不得以私募基金托管人名义宣传推介；不得向投资者承诺投资本金不受损失或者承诺最低收益。", "r": [["私募条例", 20]]}, {"t": "私募证券投资基金的初始实缴募集资金规模不得低于1000万元，不得通过投资者短期赎回基金份额等方式规避前述实缴规模要求。", "r": [["运作指引", 4]]}, {"t": "私募证券投资基金上一年度日均基金资产净值低于500万元，或者连续60个交易日出现基金资产净值低于500万元的，应当停止申购并在5个工作日内向投资者披露。", "r": [["运作指引", 4]]}, {"t": "{公司}应当自私募基金募集完毕之日起20个工作日内，向登记备案机构报送基金合同、托管协议或者保障基金财产安全的制度措施、基金财产证明文件、投资者基本信息等材料，办理备案。", "r": [["私募条例", 22]]}, {"t": "除已履行特定对象确定程序的合格投资者、符合规定的基金评价机构外，{公司}不得向不存在私募证券投资基金销售委托关系的机构或者个人提供基金净值等业绩相关信息。", "r": [["运作指引", 6]]}]}, {"id": "16", "name": "人力资源管理制度", "kind": "必建", "trigger": null, "duty": "招聘、考核、培训、激励约束与离职管理", "clauses": [{"t": "{公司}应当建立有效的人力资源管理制度，健全激励约束机制，确保工作人员具备与岗位要求相适应的职业操守和专业胜任能力。", "r": [["内控指引", 11]]}, {"t": "{公司}应当具备至少2名高级管理人员。", "r": [["内控指引", 11]]}, {"t": "{公司}应当遵循专业化管理原则，聘用具有相应从业经历的高级管理人员负责投资管理、风险控制、合规等工作。", "r": [["私募条例", 26]]}, {"t": "专职员工是指与{公司}签订劳动合同并缴纳社保的正式员工，签订劳动合同或者劳务合同的外籍员工、退休返聘员工，以及国家机关、事业单位、政府及其授权机构控制的企业委派的高级管理人员。", "r": [["登记指引1号", 9]]}, {"t": "{公司}不得采取鼓励不适当销售的考核激励措施。", "r": [["适当性办法", 29]]}, {"t": "{公司}及其员工跟投本管理人管理的私募证券投资基金的，其份额锁定期不得少于6个月。", "r": [["运作指引", 7]]}]}, {"id": "17", "name": "信息技术管理制度", "kind": "触发", "trigger": "信息技术自建", "duty": "交易系统、数据安全、网络与应急", "clauses": [{"t": "{公司}自行承担信息技术职能的，应当建立相应的信息系统，保证信息技术的顺利运行。", "r": [["内控指引", 24]]}, {"t": "{公司}应当建立保障信息技术系统安全、数据安全的风控机制和应急管理制度，确保网络和信息安全管理能力、风险控制能力、软硬件及人员配置与交易策略、业务规模、业务复杂程度等相匹配。", "r": [["运作指引", 34]]}, {"t": "信息技术系统应当持续稳定运行，不得影响证券期货交易场所信息系统安全。", "r": [["运作指引", 34]]}]}, {"id": "18", "name": "会计核算与财务管理制度", "kind": "触发", "trigger": "会计核算自建", "duty": "估值核算、财务记账、审计配合", "clauses": [{"t": "{公司}自行承担会计核算等职能的，应当建立相应的会计系统，保证会计核算的顺利运行。", "r": [["内控指引", 24]]}, {"t": "{财务部}应当对不同私募基金财产分别记账、分别核算。", "r": [["内控指引", 18], ["私募条例", 11]]}, {"t": "私募证券投资基金应当实行净值化管理，估值核算业务应当符合《企业会计准则》《中国证监会关于证券投资基金估值业务的指导意见》等有关规定，并由私募基金托管人复核确认后再披露净值信息。", "r": [["运作指引", 29]]}, {"t": "{公司}应当按照规定聘请会计师事务所对私募基金财产进行审计，向投资者提供审计结果，并报送登记备案机构。", "r": [["私募条例", 29]]}, {"t": "财务和其他信息应当真实、准确、完整、及时。", "r": [["内控指引", 4]]}]}, {"id": "19", "name": "档案管理制度", "kind": "必建", "trigger": null, "duty": "资料归档、保存期限管理、查阅审批", "clauses": [{"t": "{公司}应当保存私募基金内部控制活动等方面的信息及相关资料，确保信息的完整、连续、准确和可追溯，保存期限自私募基金清算终止之日起不得少于10年。", "r": [["内控指引", 26]]}, {"t": "适当性相关资料（匹配方案、告知警示资料、录音录像资料、自查报告等）的保存期限不得少于20年。", "r": [["适当性办法", 32]]}, {"t": "程序化交易的历史交易记录、算法或策略的文字说明等投资决策、交易涉及资料，保存期限自基金清算结束之日起不得少于20年。", "r": [["运作指引", 21]]}, {"t": "{综合部}负责统一归档，档案查阅应当履行审批手续并登记。", "r": [["内控指引", 26]]}]}, {"id": "20", "name": "内部监督与内控评价制度", "kind": "必建", "trigger": null, "duty": "内控检查、评价、缺陷整改跟踪", "clauses": [{"t": "{公司}应当对内部控制制度的执行情况进行定期和不定期的检查、监督及评价，排查内部控制制度是否存在缺陷及实施中是否存在问题，并及时予以改进。", "r": [["内控指引", 27]]}, {"t": "{公司}应当对内部控制建设与实施情况进行周期性监督检查，评价内部控制的有效性，发现内部控制缺陷或因业务变化导致内控需求有变化的，应当及时加以改进、更新。", "r": [["内控指引", 6, "（五）"]]}, {"t": "{合规风控部}应当每半年开展一次适当性自查，形成自查报告；发现问题的及时处理并主动报告住所地中国证监会派出机构。", "r": [["适当性办法", 30]]}]}, {"id": "21", "name": "托管人遴选制度", "kind": "触发", "trigger": "基金托管", "duty": "托管人遴选、评估与持续监督", "clauses": [{"t": "除基金合同另有约定外，私募基金应当由基金托管人托管，{公司}应当建立健全私募基金托管人遴选制度，切实保障资金安全。", "r": [["内控指引", 21], ["私募条例", 15]]}, {"t": "私募证券投资基金应当按照法律、行政法规、中国证监会等有关规定进行托管。", "r": [["运作指引", 26]]}, {"t": "{公司}应当按照规定和托管协议约定，及时向私募基金托管人提供投资者基本信息、投资标的权属变更证明材料等信息。", "r": [["私募条例", 31]]}]}, {"id": "22", "name": "保障私募基金财产安全的制度措施和纠纷解决机制", "kind": "触发", "trigger": "基金不托管", "duty": "财产安全制度措施、纠纷解决", "clauses": [{"t": "基金合同约定私募基金不进行托管的，{公司}应当明确保障私募基金财产安全的制度措施和纠纷解决机制。", "r": [["私募条例", 15], ["内控指引", 21]]}, {"t": "不进行托管的存续私募证券投资基金，不得新增投资者、不得新增基金规模、不得展期，其年度财务报告应当经符合《中华人民共和国证券法》规定的会计师事务所审计。", "r": [["运作指引", 26]]}]}, {"id": "23", "name": "募集机构遴选制度", "kind": "触发", "trigger": "委托募集", "duty": "募集机构遴选、资质审查、持续监督", "clauses": [{"t": "⚠️ 待核实：{公司}应当自行募集资金，不得委托他人募集资金（《私募投资基金监督管理条例》第十七条，行政法规）。本制度项下委托募集安排的法律有效性须经核实后确认。", "r": [["私募条例", 17]]}, {"t": "在法律法规及中国证监会另有规定的前提下，委托募集的应当委托获得中国证监会基金销售业务资格且成为中国证券投资基金业协会会员的机构募集私募基金，并制定募集机构遴选制度。", "r": [["内控指引", 17]]}, {"t": "委托募集应当切实保障募集结算资金安全，确保私募基金向合格投资者募集以及不变相进行公募。", "r": [["内控指引", 17]]}]}, {"id": "24", "name": "外包业务控制制度", "kind": "触发", "trigger": "其他外包", "duty": "外包机构遴选、风险评估、持续监控", "clauses": [{"t": "{公司}开展业务外包应当制定相应的风险管理框架及制度，根据审慎经营原则制定业务外包实施规划，确定与其经营水平相适宜的外包活动范围。", "r": [["内控指引", 22]]}, {"t": "{公司}应当建立健全外包业务控制，并至少每年开展一次全面的外包业务风险评估。", "r": [["内控指引", 23]]}, {"t": "在开展业务外包的各个阶段，应当关注外包机构是否存在与外包服务相冲突的业务，以及外包机构是否采取有效的隔离措施。", "r": [["内控指引", 23]]}]}, {"id": "25", "name": "突发事件处理预案", "kind": "必建", "trigger": null, "duty": "突发事件处置、报告与恢复", "clauses": [{"t": "{公司}应当建立突发事件处理预案，对严重损害投资者利益、影响正常经营或者可能引发系统性风险的突发事件的处理机制作出明确安排。", "r": [["登记指引1号", 11]]}, {"t": "发生突发事件时，{公司}应当按照预案妥善处理，并及时向注册地所在的中国证监会派出机构和协会报告。", "r": [["登记指引1号", 11]]}, {"t": "因不可抗力、意外事件、重大技术故障、重大人为差错等突发性事件可能引发重大异常波动或者影响证券期货交易正常进行的，{公司}应当立即采取暂停交易、撤销委托等处置措施，并及时向其委托的证券公司或者期货公司报告。", "r": [["运作指引", 21]]}]}, {"id": "26", "name": "集团化合规与风险管理体系", "kind": "触发", "trigger": "同一实控人控制两家以上管理人", "duty": "集团层面合规监督、风险隔离", "clauses": [{"t": "控股股东、实际控制人应当合理区分各私募基金管理人的业务范围，并就业务风险隔离、避免同业化竞争、关联交易管理和防范利益冲突等内控制度作出合理有效安排。", "r": [["登记备案办法", 17]]}, {"t": "同一控股股东、实际控制人控制两家以上私募基金管理人的，应当建立与所控制的私募基金管理人的管理规模、业务情况相适应的持续合规和风险管理体系，在保障私募基金管理人自主经营的前提下，加强对私募基金管理人的合规监督、检查。", "r": [["登记备案办法", 18]]}]}, {"id": "29", "name": "组合投资与集中度管理制度", "kind": "必建", "trigger": null, "duty": "组合投资比例监控、被动超限调整", "clauses": [{"t": "私募证券投资基金应当采用资产组合的方式进行投资，单只私募证券投资基金投资于同一资产的资金不得超过该基金净资产的25%，同一私募基金管理人管理的全部私募证券投资基金投资于同一资产的资金不得超过该资产的25%。", "r": [["运作指引", 12]]}, {"t": "下列投资品种不计入前款比例：银行活期存款、国债、债券通用质押式回购、中央银行票据、政策性金融债、地方政府债券、公开募集基金等中国证监会、协会认可的投资品种。", "r": [["运作指引", 12]]}, {"t": "标准化期货和衍生品类资产按照单只期货或者期权合约视为同一资产。", "r": [["运作指引", 41]]}, {"t": "受证券期货市场波动、证券发行人合并、基金规模变动等{公司}之外的因素影响导致投资比例不符合规定的，{公司}应当在20个交易日内调整至符合要求；因资产流动性受限无法完成调整的，应当在相关资产可出售、可转让或者恢复交易后的20个交易日内调整至符合要求。", "r": [["运作指引", 22]]}, {"t": "投资比例可以按照买入成本与市值孰低法计算。", "r": [["运作指引", 22]]}, {"t": "{合规风控部}应当于每个交易日监控组合投资比例，发现超限的按前条规定时限完成调整并留痕。", "r": [["运作指引", 12], ["运作指引", 22]]}]}, {"id": "30", "name": "杠杆与风险敞口管理制度", "kind": "必建", "trigger": null, "duty": "杠杆监控、敞口限额、压力测试", "clauses": [{"t": "私募证券投资基金的总资产不得超过该基金净资产的200%，不得通过场外衍生品等工具规避杠杆限制，不得参与场外配资。", "r": [["运作指引", 15]]}, {"t": "投向AA级及以下信用债（可转债除外）、流动性受限资产合计超过该基金净资产20%的，总资产不得超过该基金净资产的120%。", "r": [["运作指引", 15]]}, {"t": "同一实际控制人控制的私募证券基金管理人的自有资金、管理的所有私募证券投资基金、担任投资顾问的资产管理产品合计持有单一上市公司发行的股票不得超过该上市公司可流通股票的30%。", "r": [["运作指引", 16]]}, {"t": "{公司}不得通过场外衍生品、资产管理产品等规避私募基金监管要求。", "r": [["运作指引", 38]]}, {"t": "{合规风控部}应当每季度至少开展一次压力测试，并按要求向协会报送。", "r": [["运作指引", 35]]}]}, {"id": "31", "name": "场外衍生品交易管理制度", "kind": "触发", "trigger": "场外衍生品", "duty": "场外衍生品交易对手方管理、敞口与保证金监控", "clauses": [{"t": "私募证券投资基金开展场外衍生品交易的，应当以风险管理、资产配置为目标，以国务院金融管理部门认可的机构为交易对手方。", "r": [["运作指引", 17]]}, {"t": "新增场外期权合约以及存续合约展期的，除仅开展商品类场外期权交易外，基金净资产不低于5000万元；向全部交易对手方缴纳的场外期权交易保证金和权利金合计不得超过基金净资产的25%。", "r": [["运作指引", 17]]}, {"t": "新增收益互换合约以及存续合约展期的，基金净资产不低于1000万元；参与挂钩股票、股票指数等权益类收益互换的，向交易对手方缴纳的保证金比例不低于合约名义本金的50%。", "r": [["运作指引", 17]]}, {"t": "参与证券公司等机构发行带敲入和敲出结构的场外期权或者收益凭证（如雪球结构衍生品）的合约名义本金不得超过基金净资产的25%。", "r": [["运作指引", 17]]}, {"t": "私募证券投资基金及其投资者均不得存在份额分级安排；不得将场外衍生品交易异化为股票、债券等场内标的的杠杆融资工具。", "r": [["运作指引", 17]]}, {"t": "{公司}应当在基金下一估值日前将场外衍生品交易情况、交易文件等提供给私募基金托管人。", "r": [["运作指引", 17]]}]}, {"id": "32", "name": "债券投资管理制度", "kind": "触发", "trigger": "债券投资", "duty": "债券集中度、评级与价格偏离度监控", "clauses": [{"t": "{公司}开展债券投资交易业务，应当审慎合理设置投资债券的发行人及所在地区、行业等集中度、价格偏离度、杠杆比例、主体评级、债项评级等风险控制指标。", "r": [["运作指引", 18]]}, {"t": "价格偏离度等指标出现异常情形时应当按基金合同约定及时向投资者披露，并按要求向证券交易场所报告。", "r": [["运作指引", 18]]}, {"t": "{公司}及其管理的私募证券投资基金、股东、合伙人、实际控制人、员工不得参与债券结构化发行，不得参与债券代持，不得直接或者变相收取债券发行人及第三方支付的各种形式的费用或者保证金。", "r": [["运作指引", 18]]}, {"t": "单只私募证券投资基金投资于同一债券的资金不得超过该基金净资产的10%；{公司}管理的所有私募证券投资基金投资于同一债券的数量不得超过该债券存续数量的10%。", "r": [["运作指引", 19]]}, {"t": "单只私募证券投资基金投资于同一发行人及其关联方发行的债券资金总额不得超过基金净资产的25%。", "r": [["运作指引", 19]]}]}, {"id": "33", "name": "程序化交易管理制度", "kind": "触发", "trigger": "程序化交易", "duty": "策略研发测试、指令审核、异常处置与报告", "clauses": [{"t": "{公司}应当就程序化交易制定专门的业务管理和合规风控制度，完善程序化交易指令审核和监控系统。", "r": [["运作指引", 21]]}, {"t": "用于程序化交易的技术系统应当具备证券期货交易场所规定的基本功能，按照要求进行充分测试，保障持续稳定运行。", "r": [["运作指引", 21]]}, {"t": "{公司}应当建立并有效执行程序化交易策略的研发、测试、验证、合规审查、上线等业务流程。", "r": [["运作指引", 21]]}, {"t": "{公司}应当建立健全流动性、持股比例集中度、杠杆、交易频率、期现匹配、风格暴露、瞬时大额成交等投资交易的风控制度并有效执行。", "r": [["运作指引", 21]]}, {"t": "历史交易记录、算法或策略的文字说明等投资决策、交易涉及资料，保存期限自基金清算结束之日起不得少于20年。", "r": [["运作指引", 21]]}, {"t": "{公司}应当按照证券期货交易场所程序化交易报告制度履行相关手续，不得以规避报告制度等监管要求为目的分拆私募证券投资基金。", "r": [["运作指引", 21]]}]}, {"id": "34", "name": "业绩报酬与费用管理制度", "kind": "必建", "trigger": null, "duty": "业绩报酬计提、费用审核、投资者公平对待", "clauses": [{"t": "私募证券投资基金设定业绩报酬的，应当在基金合同中合理设定业绩报酬的计提方法、频率、比例，并与基金业绩表现挂钩，不得采用对自身明显有利或者过度激励的计提方式。", "r": [["运作指引", 23]]}, {"t": "私募证券投资基金只能采取一种业绩报酬计提方法，且该种计提方法应当基于单一基金份额的整体收益情况进行计算，不得对同一基金的不同策略分别计提业绩报酬。", "r": [["运作指引", 23]]}, {"t": "{公司}不得通过设置增强资金、安全垫、费用返还等方式调节基金收益或者亏损，不得以自有资金认购的基金份额先行承担亏损等形式提供风险补偿。", "r": [["运作指引", 11]]}]}, {"id": "35", "name": "流动性风险与巨额赎回管理制度", "kind": "必建", "trigger": null, "duty": "流动性监测、压力测试、巨额赎回处置", "clauses": [{"t": "开放式私募证券投资基金原则上不设置预警线、止损线。", "r": [["运作指引", 24]]}, {"t": "开放式私募证券投资基金至多每周开放一次申购、赎回，每次开放不得超过2天。基金合同中应当约定不少于3个月的份额锁定期或者与基金份额持有期限对应的短期赎回费用安排。", "r": [["运作指引", 7]]}, {"t": "基金合同中应当明确约定基金巨额赎回和连续巨额赎回的认定标准、赎回顺序、赎回价格确定、赎回款项支付、告知投资者方式，以及投资者大额赎回的预约申请等事宜。", "r": [["运作指引", 25]]}, {"t": "{公司}可以与私募基金托管人协商，在确保公平对待投资者前提下采取延期办理巨额赎回申请、暂停接受赎回申请、延缓支付赎回款项、收取短期赎回费等流动性管理措施。", "r": [["运作指引", 25]]}, {"t": "{公司}应当结合市场状况和自身管理能力制定并持续更新流动性风险应急预案，明确预案触发情景、应急程序与措施。", "r": [["运作指引", 35]]}]}, {"id": "36", "name": "估值与清算管理制度", "kind": "必建", "trigger": null, "duty": "估值核算、净值复核、清算组织", "clauses": [{"t": "私募证券投资基金应当实行净值化管理，估值核算业务应当符合《企业会计准则》《中国证监会关于证券投资基金估值业务的指导意见》等有关规定，并由私募基金托管人复核确认后再披露净值信息。", "r": [["运作指引", 29]]}, {"t": "私募证券投资基金进入清算程序后，不得新增募集、不得新增投资，私募基金托管人、经纪商等服务机构应当予以监督及配合。", "r": [["运作指引", 30]]}, {"t": "开放式私募证券投资基金上一年度日均基金资产净值低于500万元，或者连续60个交易日出现基金资产净值低于500万元的，应当停止申购；停止申购后连续120个交易日仍低于500万元的，应当进入清算程序。", "r": [["运作指引", 4]]}]}, {"id": "37", "name": "自有资金投资管理制度", "kind": "触发", "trigger": "自有资金投资", "duty": "自有资金投资决策、隔离与报送", "clauses": [{"t": "{公司}应当在风险可测、可控、可承受的前提下开展自有资金投资，建立自有资金投资管理制度和外部投资者利益绑定机制。", "r": [["运作指引", 33]]}, {"t": "自有资金通过独立账户、私募基金或者资产管理产品等进行投资运作的，应当与私募基金管理业务有效隔离，并按要求向协会进行报送。", "r": [["运作指引", 33]]}, {"t": "{公司}应当公平对待自有资金投资与其管理的私募证券投资基金投资，不得利用资金、信息、技术、策略等优势为自有资金牟取不正当利益。", "r": [["运作指引", 33]]}, {"t": "{公司}的员工、穿透后参与实际经营的自然人股东或者合伙人、自然人实际控制人，以及前述主体实际控制的资金开展证券、私募基金等投资的，适用本制度。", "r": [["运作指引", 33]]}]}, {"id": "38", "name": "防范通道业务管理制度", "kind": "必建", "trigger": null, "duty": "投资者资金来源审查、通道业务排查", "clauses": [{"t": "{公司}应当履行受托管理职责，不得由投资者、第三方下达投资指令或者负责投资运作。", "r": [["运作指引", 38], ["私募条例", 27]]}, {"t": "{公司}不得为投资者、证券发行人、金融机构、其他私募基金管理人、资产管理产品以及其他私募基金等第三方提供规避投资范围、杠杆约束、投资者门槛等监管要求的通道服务。", "r": [["运作指引", 38]]}, {"t": "{公司}应当对投资者资金来源的合规性进行审查。", "r": [["运作指引", 38]]}, {"t": "{公司}开展证券投资顾问业务的，不得通过担任投资顾问方式规避监管规定。", "r": [["运作指引", 39]]}, {"t": "私募证券投资基金架构应当清晰、透明，不得通过设置复杂架构、多层嵌套等方式规避监管要求。", "r": [["运作指引", 14]]}]}]}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("platform-data").textContent);
var LAWS = DATA.laws, MODULES = DATA.modules, META = DATA.meta.law_meta;

/* ---------- 工具 ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
var CN=["零","一","二","三","四","五","六","七","八","九"];
function cn(n){n=+n;
  if(n<10)return CN[n];
  if(n<20)return "十"+(n%10?CN[n%10]:"");
  if(n<100)return CN[Math.floor(n/10)]+"十"+(n%10?CN[n%10]:"");
  return ""+n;}
function artName(k,no,item){
  return META[k].name + "第" + cn(no) + "条" + (item||"");}
function artText(k,no){
  var a=LAWS[k]; if(!a) return "";
  return a[no] || a[""+no] || "";}
var MISSING="⚠️ 该条原文尚未录入原文库，落脚注前须以官方原文复核。";

/* ---------- 部门 ---------- */
var DEPT_KEYS=[
  {ph:"{投资部}",   kw:["投资","投研"],              std:null},
  {ph:"{研究部}",   kw:["研究"],                      std:null},
  {ph:"{交易部}",   kw:["交易","执行"],               std:null},
  {ph:"{合规风控部}",kw:["合规","风控","风险"],        std:null},
  {ph:"{市场部}",   kw:["市场","募集","营销","财富"],  std:null},
  {ph:"{综合部}",   kw:["综合","运营","行政","人事","人力"],std:null},
  {ph:"{财务部}",   kw:["财务","会计"],               std:null},

];
function deptMap(){

function fallback(){

  {key:"合规",   name:"合规风控", min:2, why:"必须设置负责合规风控的高级管理人员，独立履行监督检查评价报告建议职能",

/* ---------- 诊断 ---------- */
function diagnose(cfg){
  var r=[], depts=cfg.depts, total=0;
  depts.forEach(function(d){total+=d.count;});

  function has(kw){ for(var i=0;i<depts.length;i++){
      for(var j=0;j<kw.length;j++) if(depts[i].name.indexOf(kw[j])>=0) return depts[i]; } return null; }

  // 1 合规风控负责人
  if(!cfg.cco){
    r.push({lvl:"sev", t:"未设置合规风控负责人",
      a:"法规强制要求设置负责合规风控的高级管理人员，该岗位独立履行对内部控制的监督、检查、评价、报告和建议职能。缺失此项将导致内控制度整体不成立。",
      ref:[["内控指引",12]]});
  }
  // 2 高管人数
  if(cfg.execN<2){
    r.push({lvl:"sev", t:"高级管理人员不足 2 人（当前 "+cfg.execN+" 人）",
      a:"私募基金管理人应当具备至少 2 名高级管理人员。",
      ref:[["内控指引",11]]});
  }
  // 3 专职员工
  if(total<5){
    r.push({lvl:"warn", t:"专职员工合计不足 5 人（当前 "+total+" 人）",
      a:"管理人登记要求专职员工不少于 5 人。此为登记条件而非制度条文，但需在制度与人员规划中同步解决。",
      ref:[["登记备案办法",8]]});
  }
  // 4 投资与交易分离
  var inv=has(["投资","投研"]), trd=has(["交易","执行"]);
  if(inv && !trd){
    r.push({lvl:"sev", t:"缺交易执行职能，投资决策与交易执行未分离",
      a:"组织结构应当体现职责明确、相互制约，通过部门分设、岗位分设实现业务流程控制。投资经理不得兼任交易员。",
      ref:[["内控指引",10],["内控指引",14]]});
  }
  if(inv && trd && inv.count>=1 && trd.count>=1 && inv.name===trd.name){
    r.push({lvl:"sev", t:"投资与交易为同一部门，未实现岗位分离",
      a:"同一部门同时承担投资决策与交易执行，不满足相互制约要求。应当分设或在部门内明确岗位隔离并留痕。",
      ref:[["内控指引",10],["内控指引",14]]});
  }
  // 5 职能齐备性
  var missing=[];
  STD.forEach(function(s){
    var hit=has([s.key]);
    if(!hit) missing.push(s);
  });
  if(missing.length){
    r.push({lvl:"warn", t:"缺 "+(missing.length)+" 项建议职能："+missing.map(function(s){return s.name;}).join("、"),
      a:"内部控制应当覆盖各项业务、各个部门和各级人员，并涵盖资金募集、投资研究、投资运作、运营保障和信息披露等主要环节。小型机构可一人多岗，但必须保留相互制约，并在制度中写明兼岗与隔离安排。",
      ref:[["内控指引",5],["内控指引",10]]});
  }
  // 6 人数低于建议
  var low=[];
  STD.forEach(function(s){
    var hit=has([s.key]);
    if(hit && hit.count<s.min) low.push(s.name+"（现 "+hit.count+" / 建议 "+s.min+"）");
  });
  if(low.length){
    r.push({lvl:"warn", t:"部分职能人数低于建议配置",
      a:low.join("；")+"。内部控制应当与管理规模和员工人数相匹配（成本效益原则），但关键岗位不得因精简而失去制约。",
      ref:[["内控指引",5],["内控指引",11]]});
  }
  // 7 委托募集风险（最优先提示）
  if(cfg.o.entrust){
    r.push({lvl:"sev", t:"委托募集存在法律冲突，须先行核实",
      a:"《私募投资基金监督管理条例》第十七条（行政法规，2023-09-01 施行）规定『私募基金管理人应当自行募集资金，不得委托他人募集资金，但国务院证券监督管理机构另有规定的除外』，与《内控指引》第十七条的委托募集安排冲突。按上位法优先、新法优先，应以条例为准。违反罚则：没收违法所得并处 1–5 倍罚款；无违法所得或不足 100 万元的，并处 10 万–100 万元。",
      ref:[["私募条例",17],["私募条例",48]]});
  }
  // 8 场内衍生品口径提示
  if(!r.length){
    r.push({lvl:"ok", t:"架构未见阻断性问题",
      a:"已覆盖关键合规要求。仍建议逐项核对下方职能配置表，并确认合规风控负责人独立履职。",
      ref:[["内控指引",12]]});
  }
  return r;
}

function refHtml(refs){
  if(!refs) return "";
  return refs.map(function(r){
    var miss = !artText(r[0],r[1]);
    return '<a class="ref'+(miss?" miss":"")+'" data-law="'+r[0]+'" data-no="'+r[1]+'"'+
      (miss?' title="原文未录入，须核对官方原文"':'')+'>'+esc(artName(r[0],r[1],r[2]))+(miss?" ⚠":"")+'</a>';
  }).join("");
}
function stdTable(depts){
  function has(kw){ for(var i=0;i<depts.length;i++){
      for(var j=0;j<kw.length;j++) if(depts[i].name.indexOf(kw[j])>=0) return depts[i]; } return null; }
  var h='<table class="std"><thead><tr><th style="width:14%">职能</th><th style="width:9%">建议</th>'+
        '<th style="width:9%">现状</th><th style="width:14%">依据</th><th>说明与法规要求</th></tr></thead><tbody>';
  STD.forEach(function(s){
    var hit=has([s.key]);
    var cls = !hit ? "miss" : (hit.count<s.min ? "low" : "hit");
    h+='<tr class="'+cls+'"><td><b>'+esc(s.name)+'</b></td>'+
       '<td class="n">'+s.min+'</td><td class="n">'+(hit?hit.count:"—")+'</td>'+
       '<td>'+refHtml(s.ref)+'</td><td>'+esc(s.why)+'</td></tr>';
  });
  h+='</tbody></table>';
  return h;
}

/* ---------- 制度生成 ---------- */
function fill(tpl,cfg,dm){
  var s=String(tpl);
  s=s.replace(/\{公司\}/g, cfg.company||"本公司");
  s=s.replace(/\{最高权力机构\}/g, cfg.gov||"股东会");
  s=s.replace(/\{总经理\}/g, cfg.gm||"总经理");
  s=s.replace(/\{合规风控负责人\}/g, cfg.cco||"合规风控负责人");
  s=s.replace(/\{投资决策委员会\}/g, "投资决策委员会");
  for(var k in dm){ s=s.split(k).join(dm[k]||fallback()[k]); }
  return s;
}
function clauseBlock(txt,refs,cfg){
  var out=esc(txt)+"\n";
  (refs||[]).forEach(function(r){
    out+="\n【依据】"+artName(r[0],r[1],r[2])+"\n";
    var t=artText(r[0],r[1]);
    if(t) out+="【原文】"+t+"\n";
  });
  return out+"\n";
}
function buildDoc(mod,cfg,dm){
  var L=[];
  L.push("《"+(cfg.company||"本公司")+mod.name+"》");
  L.push("");
  L.push("（经"+(cfg.gov||"股东会")+"审议通过后施行）");
  L.push("");
  L.push("第一章  总则");
  L.push("");
  var n=0;
  function put(txt,refs){ n++; L.push("第"+cn(n)+"条  "+txt); L.push("");
    (refs||[]).forEach(function(r){
      L.push("【依据】"+artName(r[0],r[1],r[2]));
      var t=artText(r[0],r[1]);
      L.push("【原文】"+(t||MISSING));
      L.push("");
    });
  }
  put("为规范"+(cfg.company||"本公司")+mod.name.replace("制度","")+"相关工作，根据现行法律法规及自律规则，制定本制度。",[["内控指引",3]]);
  put("本制度适用于"+(cfg.company||"本公司")+"及全体员工，相关业务环节及所有部门和人员均应当遵守。",[["内控指引",5]]);
  var duty=(dm["{合规风控部}"]||"合规风控部门");
  put("职责分工："+(mod.duty||"")+"由"+(duty||"合规风控部门")+"归口统筹；"+
      "各相关部门按授权权限具体执行；合规风控负责人对执行情况独立履行监督、检查、评价、报告和建议职能。",
      [["内控指引",10],["内控指引",12]]);

  L.push("第二章  管理要求");
  L.push("");
  (mod.clauses||[]).forEach(function(c){
    put(fill(c.t,cfg,dm), c.r);
  });

  L.push("第三章  记录与档案");
  L.push("");
  put("本制度项下的记录、审批文件及留痕资料应当完整归档，确保信息的完整、连续、准确和可追溯，保存期限自私募基金清算终止之日起不得少于10年；其中适当性相关资料保存期限不得少于20年。",
      [["内控指引",26],["适当性办法",32]]);

  L.push("第四章  监督与责任");
  L.push("");
  put((duty||"合规风控部门")+"应当对本制度执行情况进行定期和不定期的检查、监督及评价，发现缺陷及时改进；对违反本制度造成损失的责任人员追究相应责任。",
      [["内控指引",27]]);
  put("本制度随法律法规调整及公司经营战略、方针、理念等内外部环境变化同步修订。",[["内控指引",5]]);

  L.push("第五章  附则");
  L.push("");
  put("本制度由"+(duty||"合规风控部门")+"负责解释。",[["内控指引",3]]);
  put("本制度自"+(cfg.gov||"股东会")+"审议通过之日起施行。",[["内控指引",3]]);

  L.push("");
  L.push("---");
  L.push("");
  L.push("附：法规依据索引表");
  L.push("");
  var used={};
  (mod.clauses||[]).forEach(function(c){ (c.r||[]).forEach(function(r){
      used[r[0]]=used[r[0]]||{}; used[r[0]][r[1]]=1; }); });
  ["内控指引","运作指引","适当性办法","私募条例","登记指引1号","登记备案办法"].forEach(function(k){
    if(used[k]||k==="内控指引"){
      L.push("| "+META[k].name+" | "+META[k].org+" | "+META[k].date+" | "+META[k].level+" | 现行有效 |");
    }
  });
  L.push("");
  L.push("注：本制度为草案，须经合规风控负责人审核、最高权力机构审议通过后方生效。");
  return L.join("\n");
}

             (m.trigger==="债券投资" && cfg.o.bond) ||

function collectCfg(){
  return {
    company:$("company").value.trim(),
    gov:$("gov").value.trim()||"股东会",
    gm:$("gm").value.trim(),
    cco:$("cco").value.trim(),
    execN:parseInt($("execN").value,10)||0,
    depts:readDepts(),
    o:{custody:opt("o_custody"),entrust:opt("o_entrust"),it:opt("o_it"),acct:opt("o_acct"),
       out:opt("o_out"),otc:opt("o_otc"),bond:opt("o_bond"),prog:opt("o_prog"),
       prop:opt("o_prop"),group:opt("o_group")}
  };
}
function generate(){
  var cfg=collectCfg(), dm=deptMap(), fb=fallback();
  for(var k in fb){ if(!dm[k]) dm[k]=fb[k]; }
  var ids=[], boxes=$("modList").querySelectorAll("input[type=checkbox]");
  for(var i=0;i<boxes.length;i++) if(boxes[i].checked) ids.push(boxes[i].getAttribute("data-id"));
  if(!ids.length){ alert("请至少选择一个制度模块"); return; }
  var parts=[];
  parts.push("# "+(cfg.company||"本公司")+"内部控制制度汇编");
  parts.push("");
  parts.push("> 生成时间：依据现行法律法规及自律规则自动汇编，每条附法规原文出处。");
  parts.push("> 本汇编为草案，须经合规风控负责人审核、最高权力机构审议通过后方生效。");
  parts.push("");
  parts.push("## 目录");
  parts.push("");
  ids.forEach(function(id,ix){
    for(var j=0;j<MODULES.length;j++) if(MODULES[j].id===id){
      parts.push((ix+1)+". 《"+(cfg.company||"本公司")+MODULES[j].name+"》");
    }
  });
  parts.push("");
  var n=0;
  ids.forEach(function(id){
    for(var j=0;j<MODULES.length;j++) if(MODULES[j].id===id){
      n++;
      parts.push("---");
      parts.push("");
      parts.push(buildDoc(MODULES[j],cfg,dm));
      parts.push("");
    }
  });
  var md=parts.join("\n");
  $("out").innerHTML=md.split("\n").map(function(ln){
    if(/^【依据】/.test(ln)) return '<span class="k">'+esc(ln)+'</span>';
    if(/^【原文】/.test(ln)) return '<span class="q">'+esc(ln)+'</span>';
    return esc(ln);
  }).join("\n");
  $("outBar").style.display="block";
  $("outStat").textContent="已生成 "+n+" 份制度 / "+md.length+" 字符";
  window.__MD__=md; window.__NAME__=(cfg.company||"内控制度");
}

/* ---------- 法规库 ---------- */
function renderLaws(q){
  q=(q||"").trim();
  var h="",cnt=0;
  Object.keys(META).forEach(function(k){
    var arts=LAWS[k]; if(!arts) return;
    var keys=Object.keys(arts);
    keys.sort(function(a,b){return (+a)-(+b);});
    keys.forEach(function(no){
      var tx=arts[no];
      if(q && tx.indexOf(q)<0 && ("第"+cn(no)+"条").indexOf(q)<0) return;
      cnt++;
      var show=q?highlight(tx,q):esc(tx);
      h+='<div class="lawitem"><div class="t">'+esc(artName(k,no))+'</div>'+
         '<div class="x">'+show+'</div></div>';
    });
  });
  $("lawOut").innerHTML = cnt? h : '<div class="empty"><b>未命中</b>换个关键词试试</div>';
}
function highlight(txt,q){
  var i=txt.indexOf(q); if(i<0) return esc(txt);
  return esc(txt.slice(0,i))+"<mark>"+esc(txt.substr(i,q.length))+"</mark>"+esc(txt.slice(i+q.length));
}
function bindRefs(){
  var as=document.querySelectorAll("a.ref");
  for(var i=0;i<as.length;i++){
    as[i].onclick=function(){
      var k=this.getAttribute("data-law"), no=this.getAttribute("data-no");
      switchTab("law"); $("lawQ").value=""; renderLaws("");
      var t=artText(k,no);
      if(t){
        $("lawOut").innerHTML='<div class="lawitem"><div class="t">'+esc(artName(k,no))+
          '</div><div class="x">'+esc(t)+'</div></div>';
      }else{
        $("lawOut").innerHTML='<div class="lawitem" style="border-left:3px solid var(--err)">'+
          '<div class="t">'+esc(artName(k,no))+'</div><div class="x">'+MISSING+'</div></div>';
      }
      window.scrollTo({top:0,behavior:"smooth"});
    };
  }
}
function switchTab(name){
  var bs=document.querySelectorAll(".tabs button");
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle("on", bs[i].getAttribute("data-tab")===name);
  var ps=document.querySelectorAll(".tabpane");
  for(var j=0;j<ps.length;j++) ps[j].classList.toggle("on", ps[j].id==="tab-"+name);
}

/* ---------- 事件 ---------- */
var bs=document.querySelectorAll(".tabs button");
for(var i=0;i<bs.length;i++) bs[i].onclick=function(){ switchTab(this.getAttribute("data-tab")); };
$("addDept").onclick=function(){ addRow("",1); };
$("fillStd").onclick=function(){
  $("deptBody").innerHTML="";
  addRow("投资部",2); addRow("研究部",1); addRow("交易部",1);
  addRow("合规风控部",2); addRow("市场部",1); addRow("综合部",1); addRow("财务部",1);
};
$("run").onclick=function(){ var c=collectCfg(); renderDiag(c); renderMods(c); switchTab("diag"); };
$("reset").onclick=function(){ location.reload(); };
$("selAll").onclick=function(){ var b=$("modList").querySelectorAll("input"); for(var i=0;i<b.length;i++) b[i].checked=true; };
$("selNone").onclick=function(){ var b=$("modList").querySelectorAll("input"); for(var i=0;i<b.length;i++) b[i].checked=false; };
$("doGen").onclick=generate;
$("copyMd").onclick=function(){
  if(!window.__MD__) return;
  navigator.clipboard.writeText(window.__MD__).then(function(){
    var b=$("copyMd"),o=b.textContent; b.textContent="已复制"; setTimeout(function(){b.textContent=o;},1400);
  });
};
$("dlMd").onclick=function(){
  if(!window.__MD__) return;
  var blob=new Blob([window.__MD__],{type:"text/markdown;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=window.__NAME__+"_内控制度汇编.md";
  a.click();
};
$("lawQ").oninput=function(){ renderLaws(this.value); };

var tot=0; Object.keys(LAWS).forEach(function(k){ tot+=Object.keys(LAWS[k]).length; });
$("badge").textContent="法规 "+tot+" 条 / 模块 "+MODULES.length+" 个";
renderLaws("");
})();
